  <script>
    (function () {
      var root = document.currentScript.ownerDocument || document;
      var elRoot = root.getElementById('f1-root');
      var container3D = root.getElementById('f1-stage-3d');

      var tl = gsap.timeline({ paused: true });

      // Animações 2D via GSAP
      tl.from('.f1-header', { opacity: 0, y: -40, duration: 0.8, ease: 'power3.out' }, 0);
      tl.from('.f1-metric-card', { opacity: 0, scale: 0.85, duration: 0.7, ease: 'back.out(1.7)' }, 0.4);

      // Inicialização do Palco 3D se Three.js e Motor3D estiverem disponíveis
      if (window.THREE && window.Motor3D && container3D) {
        var M = window.Motor3D;
        var palco = M.criarPalco(THREE, container3D, {
          largura: 1080,
          altura: 1920,
          fov: 42,
          presetCeu: 'estudio'
        });

        // Exemplo: cria um mascote/boneco no palco
        var mascote = M.criarBoneco(THREE, { escala: 0.85 });
        mascote.raiz.position.set(-0.6, 0.0, 0.0);
        palco.cena.add(mascote.raiz);

        M.conectarHyperFrames(palco, tl, function (t) {
          M.resetPose(mascote, t);
          M.respirar(mascote, t);
          M.olharCamera(mascote, palco.camera, 0.7);
        });
      }

      window.__FRAME_TIMELINE__ = tl;
    })();
  </script>
