  <script>
    (function () {
      var DUR = 9.91;
      var tl = gsap.timeline({ paused: true });

      tl.fromTo('#f3-topbar', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 0.05);
      tl.fromTo('#f3-header', { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: 0.55, ease: 'power3.out' }, 0.15);

      if (window.THREE && window.Motor3D) {
        var THREE = window.THREE;
        var M = window.Motor3D;
        var palco = M.criarPalco3D(THREE, {
          container: '#f3-stage-3d',
          largura: 1080,
          altura: 1920,
          fov: 40,
          presetCeu: 'mar'
        });

        var mar = M.criarFundoDoMar(THREE, palco, { abismo: false });
        var caboObj = M.criarCaboSubmarino(THREE, { escala: 0.78 });
        caboObj.raiz.position.set(0.42, 1.35, 0.0);
        palco.cena.add(caboObj.raiz);

        var menino = M.criarBoneco(THREE, { escala: 0.78 });
        M.capacete(menino, true);
        menino.raiz.position.set(-0.92, 0.25, 0.35);
        palco.cena.add(menino.raiz);

        var luzCobre = new THREE.PointLight(0xf59e0b, 0, 5.0);
        luzCobre.position.set(-0.3, 1.6, 1.2);
        palco.cena.add(luzCobre);

        M.conectarHyperFrames(palco, tl, function (t) {
          mar.animarAmbiente(t);
          M.resetPose(menino, t);

          var progCobre = M.faixa(t, 0.25, 1.65);
          var progVedacao = M.faixa(t, 1.75, 3.10);
          var progAco = M.faixa(t, 4.70, 6.20);
          var progJaqueta = M.faixa(t, 6.30, 7.75);

          caboObj.atualizar(t, {
            fibra: 1,
            revestimento: 1,
            tubo: 1,
            cobre: progCobre,
            vedacao: progVedacao,
            aco: progAco,
            jaqueta: progJaqueta
          });

          caboObj.raiz.rotation.y = -0.12 + Math.sin(t * 0.6) * 0.14;
          luzCobre.intensity = t < 4.6 ? 1.8 * Math.sin(progCobre * Math.PI) : 0.6;

          if (t < 4.65) {
            M.humor(menino, 'orgulhoso');
            M.apontar(menino, [-0.2, 1.35, 0.0], 'D');
            M.olharCamera(menino, palco.camera, 0.65);
            M.plano(
              palco.camera,
              t,
              0,
              4.65,
              { pos: [0.85, 1.80, 5.4], alvo: [-0.05, 1.18, 0.0] },
              { pos: [-0.55, 1.75, 5.4], alvo: [-0.15, 1.18, 0.0] }
            );
          } else {
            M.comemorar(menino, t, 6.4, 9.6);
            M.olharCamera(menino, palco.camera, 0.7);
            M.plano(
              palco.camera,
              t,
              4.65,
              DUR,
              { pos: [-0.55, 1.75, 5.4], alvo: [-0.15, 1.18, 0.0] },
              { pos: [-0.95, 1.82, 5.6], alvo: [-0.2, 1.18, 0.0] }
            );
            M.tremer(palco.camera, t, 5.8, 0.35, 0.08);
          }
        }, { duracao: DUR, offsetGlobal: 20.50 });
      }

      window.__timelines = window.__timelines || {};
      window.__timelines['frame-03-blindagem-aco'] = tl;
