        var cerebro =
          G({ id: 's6-cerebro' },
            T('path', { d: 'M720 392 C690 392 668 372 664 348 C638 342 624 320 632 298 C620 276 632 250 656 244 C660 220 682 204 706 210 C716 192 740 192 750 210 C774 204 796 220 800 244 C824 250 836 276 824 298 C832 320 818 342 792 348 C788 372 766 392 736 392 C730 398 726 398 720 392 Z', fill: '#0e7490', 'fill-opacity': 0.30, stroke: '#67e8f9', 'stroke-width': 5 }) +

        // silhueta diante do espelho

          '</defs>' +
          T('rect', { x: 0, y: 0, width: 1080, height: 640, fill: '#071018' }) +

          feixe +
          linha +
          marcosHtml +
          selo +

          G({ id: 's6-tagCerebro', opacity: 0 },

          G({ id: 's6-tagLimite', opacity: 0 },

        var tagL = M.pegar(cena, '#s6-tagLimite');
        var feixes = [M.pegar(cena, '#s6-feixe0'), M.pegar(cena, '#s6-feixe1'), M.pegar(cena, '#s6-feixe2')];
        var chipEls = chipsDef.map(function (c) { return M.pegar(cena, '#' + c.id); });
        var noEls = [];

        var dots = [], halos = [];

        var boy = M.mascote('#f6-mascote');
        var hud = M.medidorBarra('#f6-hud', { rotulo: 'ANOS DE MÉTODO', unidade: 'ANOS', max: 150, cor: '#38bdf8', decimais: 0 });

        M.conectar(tl, function (t, og) {
          for (var e = 0; e < 46; e++) {
            var el = M.pegar(cena, '#s6-est' + e);
            if (el) el.setAttribute('opacity', f2(0.22 + 0.55 * (0.5 + 0.5 * Math.sin(t * 1.7 + e * 1.3))));
          }

          var pulso = 1 + 0.012 * Math.sin(t * 2.1);
          cerebroEl.setAttribute('transform', 'translate(720 300) scale(' + f2(pulso) + ') translate(-720 -300)');

          var dim = suave(faixa(t, 16.3, 17.2));
          var relight = suave(faixa(t, T_LIMITE, T_LIMITE + 1.0));
          glowEl.setAttribute('opacity', f2(0.22 * (1 - dim) + (0.62 + 0.14 * Math.sin(t * 4.2)) * relight));
          cerebroEl.setAttribute('opacity', f2(1 - dim * 0.38 * (1 - relight)));

          for (var n = 0; n < nodos.length; n++) {
            var fase = 0.5 + 0.5 * Math.sin(t * 2.6 + n * 0.9);
            noEls[n].setAttribute('opacity', f2(0.45 + 0.55 * fase));
            noEls[n].setAttribute('r', f2((n % 4 === 0 ? 4.6 : 3.2) + fase * 1.4));
          }

          var ativosChips = [T_SONO, T_ATENCAO, T_MEMORIA, T_HUMOR];
          for (var cI = 0; cI < 4; cI++) {
            var kc = suave(faixa(t, ativosChips[cI], ativosChips[cI] + 0.4));
            var rc = chipEls[cI].querySelector('rect');
            var tc = chipEls[cI].querySelector('text');
            rc.setAttribute('stroke', kc > 0.5 ? '#22c55e' : '#38bdf8');
            rc.setAttribute('fill', kc > 0.5 ? 'rgba(18,44,26,0.92)' : 'rgba(6,16,30,0.92)');
            tc.setAttribute('fill', kc > 0.5 ? '#bbf7d0' : '#bae6fd');
          }

          // linha do tempo avança
          var prog = suave(faixa(t, T_LINHA, T_LINHA_FIM));
          progresso.setAttribute('x2', f2(lerp(340, 940, prog)));
          for (var m = 0; m < 4; m++) {
            var limite = 340 + (marcos[m].x - 340) / 600;
            var km = suave(faixa(prog, limite - 0.04, limite + 0.04));
            dots[m].setAttribute('fill', km > 0.5 ? (m === 3 ? '#22c55e' : '#38bdf8') : '#1e3a5f');
            dots[m].setAttribute('stroke', km > 0.5 ? (m === 3 ? '#86efac' : '#7dd3fc') : '#38bdf8');
            halos[m].setAttribute('opacity', f2(km * (0.10 + 0.10 * Math.sin(t * 3 + m))));
          }

          for (var fI = 0; fI < 3; fI++) {
            feixes[fI].setAttribute('stroke-dashoffset', f2(-t * 26 - fI * 8));
            feixes[fI].setAttribute('opacity', f2((0.5 - fI * 0.08) * suave(faixa(t, 1.4, 2.2))));
          }

          var olhar = suave(faixa(t, 2.0, 3.0));
          pessoaEl.setAttribute('transform', 'rotate(' + f2(-olhar * 1.4) + ' 466 430)');

          tagC.setAttribute('opacity', f2(suave(faixa(t, 12.9, 13.4)) * (1 - suave(faixa(t, 18.2, 18.5)))));

          var ks = suave(faixa(t, T_SELO, T_SELO + 0.6));
          selo.setAttribute('opacity', f2(ks));
          selo.setAttribute('transform', 'translate(318 512) scale(' + f2(lerp(0.6, 1, ks)) + ') translate(-318 -512)');

            bracoD: t > T_FINAL ? 116 : 40,
            bracoE: t > T_FINAL ? 30 : 12,
            olhar: [12, -4],
            inclinar: t > T_FINAL ? -2 : 2,
            pulo: t > T_SELO ? Math.abs(Math.sin((t - T_SELO) * 4.4)) * 10 : 0

      }

      window.__timelines = window.__timelines || {};
      window.__timelines['frame-06-espelho'] = tl;
    })();
  </script>
