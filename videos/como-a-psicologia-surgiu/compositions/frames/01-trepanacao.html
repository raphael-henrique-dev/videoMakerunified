          var kf = suave(faixa(t, T_FURO, T_FURO + 0.9));
          furoEl.setAttribute('transform', 'translate(640 205) scale(' + f2(kf) + ')');
          for (var rc = 0; rc < 4; rc++) {
            rachs[rc].setAttribute('opacity', f2(suave(faixa(t, T_RACHADURA + rc * 0.12, T_RACHADURA + 0.5 + rc * 0.12))));
          }

          // espíritos
          for (var eI = 0; eI < 3; eI++) {
            var ph = ((t * 0.42 + eI * 0.33) % 1);
            var on = suave(faixa(t, T_ESPIRITO, T_ESPIRITO + 0.8)) * (1 - suave(faixa(t, T_INFECCAO + 0.6, T_INFECCAO + 1.4)));
            esps[eI].setAttribute('opacity', f2(on * (0.15 + 0.85 * (1 - ph))));
            esps[eI].setAttribute('transform', 'translate(0 ' + f2(-ph * 60) + ')');
          }

          var ti = suave(faixa(t, T_INFECCAO, T_INFECCAO + 0.7));
          tagT.setAttribute('opacity', f2(suave(faixa(t, 0.9, 1.4))));
          tagE.setAttribute('opacity', f2(suave(faixa(t, T_ESPIRITO + 0.1, T_ESPIRITO + 0.6)) * (1 - ti)));
          tagI.setAttribute('opacity', f2(ti));
          infec.setAttribute('opacity', f2(ti * (0.55 + 0.4 * Math.sin(t * 5.2))));
          infec.setAttribute('r', f2(60 + 8 * Math.sin(t * 4.4)));

          var ks = suave(faixa(t, T_SELO, T_SELO + 0.6));
          selo.setAttribute('opacity', f2(ks));
          selo.setAttribute('transform', 'translate(650 330) scale(' + f2(lerp(0.55, 1, ks)) + ') translate(-650 -330)');

          hud.atualizar(0, ti > 0.5 ? 'DOR INTACTA' : 'ESPÍRITO NÃO SAI', ti > 0.5 ? '#ef4444' : '#f59e0b');

          boy.atualizar(t, og, {
            humor: t > T_INFECCAO + 0.3 ? 'triste' : 'surpreso',
            bracoD: t > T_INFECCAO + 0.3 ? 74 : 148,
            bracoE: t > T_INFECCAO + 0.3 ? 62 : 148,
            olhar: [4, -2],
            tremer: t > T_INFECCAO + 0.4 ? 0.7 : 0,
            inclinar: t > T_INFECCAO + 0.3 ? 4 : 0
          });
        }, { duracao: DUR, offsetGlobal: 0.00 });
      }

      window.__timelines = window.__timelines || {};
      window.__timelines['frame-01-trepanacao'] = tl;
    })();
  </script>
