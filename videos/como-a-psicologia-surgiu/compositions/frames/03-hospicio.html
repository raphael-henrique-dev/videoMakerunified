        // cela com silhueta

          T('rect', { x: 286, y: 108, width: 240, height: 424, fill: '#0a111c', stroke: '#334155', 'stroke-width': 4 }) +
          G({ id: 's3-preso', opacity: 0 },
            T('circle', { cx: 412, cy: 350, r: 30, fill: '#141e2b' }) +
            T('path', { d: 'M368 560 C368 470 386 418 412 414 C438 418 456 470 456 560 Z', fill: '#141e2b' })) +

          })() +
          T('rect', { x: 286, y: 108, width: 240, height: 10, fill: '#475569' }) +

          T('rect', { x: 286, y: 300, width: 240, height: 8, fill: '#334155' });

        // correntes
        function corrente(x, y0, n, id) {

        // cadeira giratória com rodas e cintos

            T('rect', { x: 604, y: 330, width: 72, height: 106, rx: 10, fill: '#4a2c17', stroke: '#6b4423', 'stroke-width': 3 }) +

        var vapor = '';

        var preso = M.pegar(cena, '#s3-preso');

        var corr1 = M.pegar(cena, '#s3-corrente1');
        var tagC = M.pegar(cena, '#s3-tagCorrente');
        var tagCad = M.pegar(cena, '#s3-tagCadeira');
        var tagG = M.pegar(cena, '#s3-tagGelo');

        var vaporEl = [];

        M.conectar(tl, function (t, og) {
          corr0.setAttribute('transform', 'rotate(' + f2(Math.sin(t * 1.5) * 4) + ' 548 102)');
          corr1.setAttribute('transform', 'rotate(' + f2(Math.sin(t * 1.7 + 0.8) * 5) + ' 578 76)');

          // cadeira gira cada vez mais rápido
          var acel = suave(faixa(t, T_CADEIRA, T_CADEIRA + 1.6));
          var freia = suave(faixa(t, T_FRACASSO, T_FRACASSO + 1.4));
          var ang = (t - T_CADEIRA) * 220 * acel * (1 - freia * 0.92);
          cadeiraEl.setAttribute('transform', 'rotate(' + f2(ang) + ' 640 470)');
          var rapidez = acel * (1 - freia);
          blur0.setAttribute('opacity', f2(rapidez * 0.55));
          blur1.setAttribute('opacity', f2(rapidez * 0.4));
          blur0.setAttribute('transform', 'rotate(' + f2(ang * 0.5) + ' 640 404)');
          blur1.setAttribute('transform', 'rotate(' + f2(ang * 0.35) + ' 640 380)');

          // vapor do gelo
          for (var i = 0; i < 3; i++) {
            var ph = ((t * 0.35 + i * 0.31) % 1);
            var on = suave(faixa(t, T_GELO, T_GELO + 0.8));
            vaporEl[i].setAttribute('opacity', f2(on * 0.45 * (1 - ph)));
            vaporEl[i].setAttribute('transform', 'translate(0 ' + f2(-ph * 34) + ')');
          }
          for (var gI = 0; gI < 7; gI++) {
            gelos[gI].setAttribute('transform', 'translate(0 ' + f2(Math.sin(t * 1.6 + gI) * 2.4) + ')');
          }

          // preso se encolhe
          var kpreso = suave(faixa(t, T_CELA, T_CELA + 0.9));
          var enc = suave(faixa(t, T_FRACASSO, T_FRACASSO + 1.6));
          preso.setAttribute('transform', 'translate(412 560) scale(1 ' + f2(1 - enc * 0.05) + ') translate(-412 -560)');
          preso.setAttribute('opacity', f2(kpreso * (0.9 - enc * 0.15)));

          tagC.setAttribute('opacity', f2(suave(faixa(t, 5.6, 6.1))));
          tagCad.setAttribute('opacity', f2(suave(faixa(t, 8.6, 9.1)) * (1 - suave(faixa(t, 14.4, 14.7)))));
          tagG.setAttribute('opacity', f2(suave(faixa(t, 8.3, 8.8))));

          var kselo = suave(faixa(t, T_SELO, T_SELO + 0.5));
          var zeroPulse = Math.sin(faixa(t, T_ZERO, T_ZERO + 0.55) * Math.PI);
          seloEl.setAttribute('opacity', f2(kselo));
          seloEl.setAttribute('transform', 'translate(640 300) scale(' + f2(lerp(0.7, 1, kselo) + zeroPulse * 0.06) + ') translate(-640 -300)');

          hud.atualizar(0, t >= T_ZERO ? 'ZERO ESCUTA. ZERO CURA.' : (enc > 0.5 ? 'NINGUÉM MEDIA NADA' : 'CASTIGO COM NOME DE CURA'), t >= T_ZERO || enc > 0.5 ? '#ef4444' : '#94a3b8');

          boy.atualizar(t, og, {
            humor: 'triste',

            bracoE: enc > 0.5 ? 44 : 26,

            tremer: 0.45 + enc * 0.4,
            inclinar: 5
          });
        }, { duracao: DUR, offsetGlobal: 35.63 });
      }

      window.__timelines = window.__timelines || {};
      window.__timelines['frame-03-hospicio'] = tl;
    })();
  </script>
