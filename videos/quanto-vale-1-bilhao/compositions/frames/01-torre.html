        // Prédio de comparação (silhueta estilo torre alta)

        var janelasP = '';
        for (var r = 0; r < 7; r++) {
          for (var c = 0; c < 3; c++) {

        var reguas =
          G({ id: 's1-reguaTorre', opacity: 0 },
            T('line', { x1: 492, y1: 560, x2: 492, y2: TOPO, stroke: '#f59e0b', 'stroke-width': 2, 'stroke-dasharray': '8 8' }) +
            T('line', { x1: 484, y1: 560, x2: 508, y2: 560, stroke: '#f59e0b', 'stroke-width': 3 }) +

          G({ id: 's1-reguaPredio', opacity: 0 },
