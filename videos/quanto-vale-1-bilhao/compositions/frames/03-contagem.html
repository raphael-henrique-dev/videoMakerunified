          var r1 = R - (k % 5 === 0 ? 22 : 10);
          marcas += T('line', {
            x1: f2(CX + Math.cos(a) * r1), y1: f2(CY + Math.sin(a) * r1),
            x2: f2(CX + Math.cos(a) * (R - 4)), y2: f2(CY + Math.sin(a) * (R - 4)),
            stroke: k % 5 === 0 ? '#7dd3fc' : '#334155', 'stroke-width': k % 5 === 0 ? 4 : 2, 'stroke-linecap': 'round'
          });
        }

        // barra de vida 0–80 anos
        var LX = 300, LW = 600, LY = 470, LH = 44, MAXA = 80;
        var xa = function (a) { return LX + (a / MAXA) * LW; };
        var x10 = xa(10), x41 = xa(41.7);

        var svg = M.svgBase(1080, 630,
          '<defs>' +
          '<linearGradient id="s3-ceu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#132340"/><stop offset="1" stop-color="#050a14"/></linearGradient>' +

          T('rect', { x: 0, y: 0, width: 1080, height: 630, fill: 'url(#s3-ceu)' }) +
          T('circle', { cx: CX, cy: CY, r: 210, fill: 'url(#s3-brilho)' }) +
          T('circle', { cx: CX, cy: CY, r: R + 14, fill: '#0b1220', stroke: 'rgba(56,189,248,0.45)', 'stroke-width': 3 }) +
          marcas +
          T('circle', { id: 's3-pulso', cx: CX, cy: CY, r: R - 6, fill: 'none', stroke: '#38bdf8', 'stroke-width': 3, opacity: 0 }) +
          T('path', { id: 's3-sweep', d: '', fill: 'none', stroke: '#38bdf8', 'stroke-width': 12, 'stroke-linecap': 'round', 'stroke-opacity': 0.55 }) +
          T('circle', { id: 's3-bead', cx: CX, cy: CY - (R - 14), r: 7, fill: '#f8fafc' }) +
          G({ id: 's3-ponteiroSeg' },
            T('line', { x1: CX, y1: CY - (R - 56), x2: CX, y2: CY - (R - 28), stroke: '#38bdf8', 'stroke-width': 5, 'stroke-linecap': 'round' })) +
          T('text', { x: CX, y: CY - 34, 'text-anchor': 'middle', fill: '#facc15', 'font-family': 'Inter, sans-serif', 'font-size': 54, 'font-weight': 700 }, 'R$ 1') +
          T('text', { x: CX, y: CY + 8, 'text-anchor': 'middle', fill: '#cbd5e1', 'font-family': 'Inter, sans-serif', 'font-size': 20, 'font-weight': 700, 'letter-spacing': 2 }, 'POR SEGUNDO') +
