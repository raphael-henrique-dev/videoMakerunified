  <script>
    (function () {
      var DUR = 16.61;
      var tl = gsap.timeline({ paused: true });

      tl.fromTo('#f3-topbar', { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.08);
      tl.fromTo('#f3-header', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: 'power3.out' }, 0.20);
      tl.fromTo('#f3-telemetry', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.45);
      tl.fromTo('#f3-banner', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: 'back.out(1.6)' }, 6.20);

      var M = window.Motor2D;
      if (M) {
        var T = M.T, G = M.G, lerp = M.lerp, suave = M.suave, faixa = M.faixa, clamp = M.clamp, mix = M.mixCor, f2 = M.f2;
        
              var svg = M.svgBase(1080, 680,
                '<defs>' +
                '<clipPath id="s3-clip"><rect x="30" y="30" width="1020" height="600" rx="26"/></clipPath>' +
                '<radialGradient id="s3-fogo"><stop offset="0" stop-color="#ef4444" stop-opacity="0.8"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>' +
                '</defs>' +
                G({ 'clip-path': 'url(#s3-clip)' },
                  T('rect', { x: 30, y: 30, width: 1020, height: 600, fill: '#141424' }) +
                  // Travesseiro fofo
                  T('ellipse', { cx: 480, cy: 460, rx: 340, ry: 90, fill: '#334155', stroke: '#475569', 'stroke-width': 4 }) +
                  T('ellipse', { cx: 480, cy: 450, rx: 310, ry: 75, fill: '#475569' }) +
                  // Brilho de calor sob o celular
                  T('circle', { id: 's3-halo', cx: 480, cy: 400, r: 160, fill: 'url(#s3-fogo)', opacity: 0 }) +
                  // Celular com capinha grossa
                  G({ transform: 'translate(340 260)' },
                    // Capa grossa emborrachada
                    T('rect', { x: -16, y: -16, width: 312, height: 232, rx: 34, fill: '#0f172a', stroke: '#ef4444', 'stroke-width': 5 }),
                    // Celular
                    T('rect', { x: 0, y: 0, width: 280, height: 200, rx: 24, fill: '#1e293b' }),
                    // Janela de raio-X mostrando as gavetas
                    T('rect', { x: 18, y: 18, width: 244, height: 164, rx: 14, fill: '#0b1329', stroke: '#38bdf8', 'stroke-width': 2 }),
                    // Gavetas internas que vão entortar
                    G({ id: 's3-gavetas' },
                      T('path', { id: 's3-p1', d: 'M30 60 L230 60', stroke: '#38bdf8', 'stroke-width': 6, 'stroke-linecap': 'round' }),
                      T('path', { id: 's3-p2', d: 'M30 100 L230 100', stroke: '#38bdf8', 'stroke-width': 6, 'stroke-linecap': 'round' }),
                      T('path', { id: 's3-p3', d: 'M30 140 L230 140', stroke: '#38bdf8', 'stroke-width': 6, 'stroke-linecap': 'round' }),
                      // Pecinhas presas
                      T('circle', { id: 's3-peca1', cx: 130, cy: 80, r: 12, fill: '#facc15' }),
                      T('circle', { id: 's3-peca2', cx: 180, cy: 120, r: 12, fill: '#facc15' })
                    ),
                    // Cabo carregando conectado
                    T('rect', { x: -36, y: 88, width: 24, height: 24, rx: 6, fill: '#f8fafc' }),
                    T('path', { d: 'M-36 100 Q-90 100 -120 160', fill: 'none', stroke: '#f8fafc', 'stroke-width': 8, 'stroke-linecap': 'round' })
                  ) +
                  // Ondas de calor
                  M.criarOndas('s3-onda', 5, false) +
                  // Termômetro grande no lado direito
                  G({ transform: 'translate(880 140)' },
                    T('rect', { x: -16, y: 0, width: 32, height: 360, rx: 16, fill: '#0f172a', stroke: '#94a3b8', 'stroke-width': 4 }),
                    T('circle', { cx: 0, cy: 380, r: 38, fill: '#ef4444', stroke: '#94a3b8', 'stroke-width': 4 }),
                    T('rect', { id: 's3-mercurio', x: -8, y: 200, width: 16, height: 180, rx: 8, fill: '#ef4444' }),
                    T('text', { id: 's3-tempTxt', x: 50, y: 390, fill: '#ef4444', 'font-family': 'Inter', 'font-weight': 700, 'font-size': 32 }, '46°C'),
                    T('text', { x: 50, y: 350, fill: '#94a3b8', 'font-family': 'Inter', 'font-weight': 600, 'font-size': 18 }, 'CALOR')
                  )
                ) +
                T('rect', { x: 30, y: 30, width: 1020, height: 600, rx: 26, fill: 'none', stroke: '#3b5b8c', 'stroke-width': 4 })
              );
              M.montar('#f3-cena', svg);
              var cena = M.pegar('#f3-cena');
              var halo = M.pegar(cena, '#s3-halo');
              var merc = M.pegar(cena, '#s3-mercurio');
              var tempTxt = M.pegar(cena, '#s3-tempTxt');
              var p1 = M.pegar(cena, '#s3-p1');
              var p2 = M.pegar(cena, '#s3-p2');
              var p3 = M.pegar(cena, '#s3-p3');
              var peca1 = M.pegar(cena, '#s3-peca1');
              var peca2 = M.pegar(cena, '#s3-peca2');
              var ondas = M.pegarLista(cena, 's3-onda', 5);
              var boy = M.mascote('#f3-mascote');
              var hud = M.medidorBarra('#f3-hud', { rotulo: 'TEMPERATURA INTERNA', unidade: '°C', max: 60, cor: '#ef4444' });
        
              M.conectar(tl, function (t, og) {
                var calor = suave(faixa(t, 2.5, 7.5));
                var deform = suave(faixa(t, 7.6, 12.0));
        
                halo.setAttribute('opacity', f2(calor * (0.6 + 0.3 * Math.sin(t * 8))));
                var temp = lerp(26, 46, calor);
                tempTxt.textContent = Math.round(temp) + '°C';
                var hMerc = lerp(80, 260, calor);
                merc.setAttribute('y', f2(380 - hMerc));
                merc.setAttribute('height', f2(hMerc));
        
                // Entortar prateleiras
                var bend = deform * 22;
                p1.setAttribute('d', 'M30 60 Q130 ' + f2(60 + bend) + ' 230 60');
                p2.setAttribute('d', 'M30 100 Q130 ' + f2(100 - bend) + ' 230 100');
                p3.setAttribute('d', 'M30 140 Q130 ' + f2(140 + bend) + ' 230 140');
                peca1.setAttribute('fill', deform > 0.5 ? '#ef4444' : '#facc15');
                peca2.setAttribute('fill', deform > 0.5 ? '#ef4444' : '#facc15');
        
                // Ondas de calor
                M.animarOndas(ondas, 480, 360, t, {
                  periodo: 2.2, r0: 60, rMax: 260, a0: -150, a1: -30, largura: 6,
                  cor: function(r, ph) { return mix('#fb923c', '#ef4444', ph); },
                  opac: function(r, ph) { return calor * 0.85 * (1 - ph); }
                });
        
                hud.atualizar(temp, temp > 40 ? 'ZONA PERIGOSA' : 'NORMAL', temp > 40 ? '#ef4444' : '#38bdf8');
        
                var bravo = t >= 7.2;
                boy.atualizar(t, og, {
                  humor: bravo ? 'bravo' : 'surpreso',
                  bracoD: bravo ? 160 : 75,
                  bracoE: bravo ? 40 : 20,
                  tremer: bravo ? 0.9 : 0,
                  olhar: [3, -3]
                });
              }, { duracao: DUR, offsetGlobal: 35.81 });
        
      }

      window.__timelines = window.__timelines || {};
      window.__timelines['frame-03-veneno-do-calor'] = tl;
    })();
  </script>
