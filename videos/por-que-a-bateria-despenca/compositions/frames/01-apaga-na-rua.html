                  ) +
                  // Tela de celular morto (surge ao apagar)
                  G({ id: 's1-morto', opacity: 0 },

                  )
                ) +

                G({ id: 's1-ralo', opacity: 0, transform: 'translate(830 340)' },

              M.montar('#f1-cena', svg);

              var parts = cena.querySelectorAll('.s1-part');
              var boy = M.mascote('#f1-mascote');
              var hud = M.medidorBateria('#f1-hud');
        
              M.conectar(tl, function (t, og) {
                // Apagão: aos 6.6s ("o celular apaga na sua cara")
                var apagou = t >= 6.6;
                var pisca = (t >= 6.3 && t < 6.6) ? (Math.sin(t * 36) > 0 ? 0.2 : 1) : (apagou ? 0 : 1);
                app.setAttribute('opacity', f2(pisca));
                morto.setAttribute('opacity', f2(apagou ? 1 : 0));
        
                // Ralo a partir de 13s
                var raloOn = suave(faixa(t, 13.0, 14.5));
                ralo.setAttribute('opacity', f2(raloOn));
                for (var p = 0; p < parts.length; p++) {
                  var ang = t * 6 + p * (Math.PI / 4);
                  var rad = 25 + 50 * (1 - ((t * 2 + p * 0.3) % 1));
                  parts[p].setAttribute('cx', f2(rad * Math.cos(ang)));
                  parts[p].setAttribute('cy', f2(rad * 0.45 * Math.sin(ang)));
                }
        
                // Bateria caindo
                var pct = t < 6.6 ? 20 - faixa(t, 0, 6.6) * 5 : lerp(15, 0, suave(faixa(t, 6.6, 7.8)));
                hud.atualizar(pct, 'BATERIA NO BOLSO', false);
                batTxt.textContent = Math.round(pct) + '%';
                batFill.setAttribute('width', f2((pct / 100) * 35));
        
                // Mascote
                boy.atualizar(t, og, {
                  humor: apagou ? 'bravo' : 'surpreso',
                  bracoD: apagou ? 168 : 80,
                  bracoE: apagou ? 168 : 20,
                  tremer: apagou ? 1.2 : 0,
                  olhar: [4, -3]
