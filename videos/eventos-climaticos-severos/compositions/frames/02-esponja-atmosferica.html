  <script>
    (function () {
      var DUR = 16.17;
      var tl = gsap.timeline({ paused: true });

      tl.fromTo('#f2-topbar', { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.08);

      tl.fromTo('#f2-c2', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 7.20);

      if (window.THREE && window.Motor3D) {
        var THREE = window.THREE;
        var M = window.Motor3D;
        var palco = M.criarPalco3D(THREE, {
          container: '#f2-stage-3d',
          largura: 1080,
          altura: 1920,
          fov: 42,
          presetCeu: 'tempestade'
        });

        var chao = M.malha(
          THREE,
          new THREE.CircleGeometry(45, 48),
          M.mat(THREE, 0x3b2314, { roughness: 0.9 })
        );
        chao.rotation.x = -Math.PI / 2;
        palco.cena.add(chao);

        var esponja = M.criarEsponjaAtmosferica(THREE);
        esponja.raiz.position.set(0.28, 0.35, 0.0);
        esponja.raiz.scale.setScalar(0.72);
        palco.cena.add(esponja.raiz);

        var menino = M.criarBoneco(THREE, { escala: 0.72 });
        menino.raiz.position.set(-0.75, 0.35, 0.45);
        palco.cena.add(menino.raiz);

        M.conectarHyperFrames(palco, tl, function (t) {
          M.resetPose(menino, t);

          var saturacao = M.suave(M.faixa(t, 0.3, 7.2));
          var chovendo = M.suave(M.faixa(t, 7.2, 8.8));
          esponja.atualizar(t, saturacao, chovendo);

          if (t < 3.8) {
            M.humor(menino, 'surpreso');
            M.apontar(menino, [0.28, 2.0, 0.0], 'D');
          } else if (t < 7.3) {
            M.humor(menino, 'cansado');
            M.suar(menino, t, 3.8, 7.3);
          } else {
            M.capacete(menino, true);
            M.humor(menino, 'assustado');
            M.tremer(palco.camera, t, 7.5, 0.45, 0.07);

          M.olharCamera(menino, palco.camera, 0.7);

          );
        }, { duracao: DUR, offsetGlobal: 15.34 });
