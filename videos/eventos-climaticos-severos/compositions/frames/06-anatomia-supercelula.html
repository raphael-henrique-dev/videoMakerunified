  <script>
    (function () {
      var DUR = 18.49;
      var tl = gsap.timeline({ paused: true });

      tl.fromTo('#f6-topbar', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 0.05);
      tl.fromTo('#f6-header', { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: 0.55, ease: 'power3.out' }, 0.15);
      tl.fromTo('.f6-layer-chip', { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.45, stagger: 0.08, ease: 'power3.out' }, 0.35);
      tl.fromTo('#f6-cta', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: 'back.out(1.5)' }, 7.65);

      if (window.THREE && window.Motor3D) {
        var THREE = window.THREE;
        var M = window.Motor3D;
        var palco = M.criarPalco3D(THREE, {
          container: '#f6-stage-3d',
          largura: 1080,
          altura: 1920,
          fov: 42,
          presetCeu: 'espaco'
        });

        var chao = M.malha(
          THREE,
          new THREE.CircleGeometry(45, 48),
          M.mat(THREE, 0x060d1c, { roughness: 0.88 })
        );
        chao.rotation.x = -Math.PI / 2;
        palco.cena.add(chao);

        var pilha = M.criarPilhaExplodidaTempestade(THREE);
        pilha.grupo.position.set(-0.48, 1.72, 0.0);
        pilha.grupo.scale.setScalar(0.68);
        palco.cena.add(pilha.grupo);

        var menino = M.criarBoneco(THREE, { escala: 0.64 });
        menino.raiz.position.set(-0.98, 0.42, 0.35);
        palco.cena.add(menino.raiz);

        var svgGroup = document.getElementById('f6-leaders-group');
        var yAlvosChips = [837, 767, 697, 627, 557, 487, 417];

        M.conectarHyperFrames(palco, tl, function (t) {
          pilha.atualizar(t, 0.15);
          M.resetPose(menino, t);

          if (t < 4.8) {
            M.humor(menino, 'orgulhoso');
            M.apontar(menino, [-0.48, 1.72, 0], 'D');
          } else if (t < 9.2) {
            M.comemorar(menino, t, 4.8, 9.2);
          } else {
            M.acenar(menino, t, 9.2, DUR, 'D');
          }
          M.olharCamera(menino, palco.camera, 0.75);

          M.plano(
            palco.camera,
            t,
            0,
            DUR,
            { pos: [0.0, 1.85, 7.4], alvo: [-0.1, 1.55, 0.0] },
            { pos: [0.1, 1.82, 7.1], alvo: [-0.1, 1.55, 0.0] }
          );

          if (svgGroup && t > 0.45) {
            var opacidadeLinhas = Math.min(1, (t - 0.45) / 0.6);
            var htmlSvg = '';
            var vecTemp = new THREE.Vector3();
            for (var i = 0; i < pilha.pecas.length; i++) {
              pilha.pecas[i].grp.getWorldPosition(vecTemp);
              var p2d = M.tela(THREE, vecTemp, palco.camera, 1080, 1920);
              var yChip = yAlvosChips[i];
              var xChip = 560;
              var xMeio = Math.round((p2d.x + xChip) * 0.56);
              htmlSvg +=
                '<circle cx="' + p2d.x.toFixed(1) + '" cy="' + p2d.y.toFixed(1) + '" r="5" fill="#38bdf8" fill-opacity="' + opacidadeLinhas.toFixed(2) + '"/>' +
                '<polyline points="' +
                p2d.x.toFixed(1) + ',' + p2d.y.toFixed(1) + ' ' +
                xMeio + ',' + yChip + ' ' +
                xChip + ',' + yChip +
                '" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 5" stroke-opacity="' + (opacidadeLinhas * 0.82).toFixed(2) + '" fill="none"/>';
            }
            svgGroup.innerHTML = htmlSvg;
          }
        }, { duracao: DUR, offsetGlobal: 76.35 });
      }

      window.__timelines = window.__timelines || {};
      window.__timelines['frame-06-anatomia-supercelula'] = tl;
    })();
  </script>
