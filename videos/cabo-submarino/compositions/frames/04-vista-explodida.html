  <script>
    (function () {
      var DUR = 10.97;
      var tl = gsap.timeline({ paused: true });

      tl.fromTo('#f4-topbar', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 0.05);
      tl.fromTo('#f4-header', { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: 0.55, ease: 'power3.out' }, 0.15);
      tl.fromTo('.f4-layer-chip', { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.45, stagger: 0.08, ease: 'power3.out' }, 0.35);
      tl.fromTo('#f4-cta', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: 'back.out(1.5)' }, 4.65);

      if (window.THREE && window.Motor3D) {
        var THREE = window.THREE;
        var M = window.Motor3D;
        var palco = M.criarPalco3D(THREE, {
          container: '#f4-stage-3d',
          largura: 1080,
          altura: 1920,
          fov: 42,
          presetCeu: 'abismo'
        });

        var mar = M.criarFundoDoMar(THREE, palco, { abismo: true });
        var pilha = M.criarPilhaExplodidaCabo(THREE);
        pilha.grupo.position.set(-0.78, 2.05, 0.0);
        pilha.grupo.scale.setScalar(0.88);
        palco.cena.add(pilha.grupo);

        var menino = M.criarBoneco(THREE, { escala: 0.72 });
        M.capaceteEspacial(menino, true);
        menino.raiz.position.set(-1.38, 0.15, 0.35);
        palco.cena.add(menino.raiz);

        var svgGroup = document.getElementById('f4-leaders-group');
        var yAlvosChips = [837, 767, 697, 627, 557, 487, 417]; // centros Y exatos dos 7 chips na direita

        M.conectarHyperFrames(palco, tl, function (t) {
          mar.animarAmbiente(t);
          pilha.atualizar(t, 0.15);
          M.resetPose(menino, t);

          if (t < 4.55) {
            M.humor(menino, 'orgulhoso');
            M.apontar(menino, [-0.78, 2.05, 0], 'D');
          } else {
            M.comemorar(menino, t, 4.55, 7.8);
            M.acenar(menino, t, 7.8, DUR, 'D');
          }
          M.olharCamera(menino, palco.camera, 0.75);

          M.plano(
            palco.camera,
            t,
            0,
            DUR,
            { pos: [0.0, 1.95, 6.1], alvo: [-0.15, 1.65, 0.0] },
            { pos: [0.15, 1.90, 5.8], alvo: [-0.15, 1.65, 0.0] }
          );

          // Projeção 3D -> 2D determinística das 7 camadas para desenhar as leader lines SVG
          if (svgGroup && t > 0.45) {
            var opacidadeLinhas = Math.min(1, (t - 0.45) / 0.6);
            var htmlSvg = '';
            var vecTemp = new THREE.Vector3();
            for (var i = 0; i < pilha.pecas.length; i++) {
              pilha.pecas[i].grp.getWorldPosition(vecTemp);
              var p2d = M.tela(THREE, vecTemp, palco.camera, 1080, 1920);
              var yChip = yAlvosChips[i];
              var xChip = 566;
              var xMeio = Math.round((p2d.x + xChip) * 0.56);
              htmlSvg +=
                '<circle cx="' + p2d.x.toFixed(1) + '" cy="' + p2d.y.toFixed(1) + '" r="5" fill="#38bdf8" fill-opacity="' + opacidadeLinhas.toFixed(2) + '"/>' +
                '<polyline points="' +
                p2d.x.toFixed(1) + ',' + p2d.y.toFixed(1) + ' ' +
                xMeio + ',' + yChip + ' ' +
                xChip + ',' + yChip +
                '" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 5" stroke-opacity="' + (opacidadeLinhas * 0.82).toFixed(2) + '" fill="none"/>';
            }
            svgGroup.innerHTML = htmlSvg;
          }
        }, { duracao: DUR, offsetGlobal: 29.01 });
      }

      window.__timelines = window.__timelines || {};
      window.__timelines['frame-04-vista-explodida'] = tl;
    })();
  </script>
