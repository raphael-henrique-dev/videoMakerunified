  <div data-hf-id="hf-uzi7" id="f1-root" data-composition-id="frame-01-gancho-abismo" data-width="1080" data-height="1920" data-start="0" data-duration="9.77">
    <div data-hf-id="hf-o0pd" id="f1-stage-3d"></div>

    <div data-hf-id="hf-x5l2" class="f1-ui-layer">
      <div data-hf-id="hf-hxh6" id="f1-topbar" class="f1-topbar">
        <span data-hf-id="hf-rm6a" class="f1-kicker">INFRAESTRUTURA GLOBAL // 99% DOS DADOS</span>

        <span data-hf-id="hf-q9g7" class="f1-alert-tag">FALHA CRÍTICA</span>
      </div>

  <script>
    (function () {
      var DUR = 9.77;
      var tl = gsap.timeline({ paused: true });

      // Animações 2D Code Editorial
      tl.fromTo('#f1-topbar', { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.08);
      tl.fromTo('#f1-header', { opacity: 0, x: -32 }, { opacity: 1, x: 0, duration: 0.65, ease: 'power3.out' }, 0.22);
      tl.fromTo('#f1-telemetry', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.45);
      tl.fromTo('#f1-alert', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: 'back.out(1.6)' }, 4.55);

      // Palco 3D Three.js + Kit Modular Motor3D
      if (window.THREE && window.Motor3D) {
        var THREE = window.THREE;
        var M = window.Motor3D;
        var palco = M.criarPalco3D(THREE, {
          container: '#f1-stage-3d',
          largura: 1080,
          altura: 1920,
          fov: 42,
          presetCeu: 'abismo'
        });

        var mar = M.criarFundoDoMar(THREE, palco, { abismo: true });
        var caboObj = M.criarCaboSubmarino(THREE, { escala: 0.78 });
        caboObj.raiz.position.set(0.35, 1.35, 0.0);
        palco.cena.add(caboObj.raiz);

        // Mascote com capacete de mergulho abissal
        var menino = M.criarBoneco(THREE, { escala: 0.78 });
        M.capaceteEspacial(menino, true);
        menino.raiz.position.set(-0.95, 0.25, 0.25);
        palco.cena.add(menino.raiz);

        // Fio de vidro separado para demonstração da quebra ("falha -> corrige")
        var fioTesteEsq = M.malha(
          THREE,
          new THREE.CylinderGeometry(0.04, 0.04, 0.9, 20),
          M.mat(THREE, 0x7dd3fc, { emissive: 0x00f0ff, emissiveIntensity: 0.9 })
        );
        fioTesteEsq.rotation.z = Math.PI / 2;
        var fioTesteDir = M.malha(
          THREE,
          new THREE.CylinderGeometry(0.04, 0.04, 0.9, 20),
          M.mat(THREE, 0x7dd3fc, { emissive: 0x00f0ff, emissiveIntensity: 0.9 })
        );
        fioTesteDir.rotation.z = Math.PI / 2;
        palco.cena.add(fioTesteEsq, fioTesteDir);

        // Luz vermelha de alerta quando a fibra racha
        var luzFalha = new THREE.PointLight(0xef4444, 0, 5.5);
        luzFalha.position.set(0, 1.5, 1.5);
        palco.cena.add(luzFalha);

        M.conectarHyperFrames(palco, tl, function (t) {
          mar.animarAmbiente(t);
          M.resetPose(menino, t);

          if (t < 4.35) {
            // Ato 1: Gancho — foco no núcleo óptico brilhando no abismo
            caboObj.raiz.visible = true;
            caboObj.atualizar(t, {
              fibra: 1,
              revestimento: 0,
              tubo: 0,
              cobre: 0,
              vedacao: 0,
              aco: 0,
              jaqueta: 0
            });
            fioTesteEsq.visible = false;
            fioTesteDir.visible = false;
            luzFalha.intensity = 0;

            M.andar(menino, t, 0.1, 2.2, [-1.15, 0.25, 0.3], [-0.75, 0.25, 0.25]);
            M.humor(menino, 'surpreso');
            M.apontar(menino, [0.35, 1.35, 0.0], 'D');
            M.olharCamera(menino, palco.camera, 0.65);

            M.plano(
              palco.camera,
              t,
              0,
              4.35,
              { pos: [-0.9, 2.0, 6.6], alvo: [0.0, 1.15, 0.0] },
              { pos: [0.2, 1.75, 5.6], alvo: [-0.1, 1.15, 0.0] }
            );
          } else {
            // Ato 2: Falha — o menino tenta esticar o fio de vidro puro e ele se parte ao meio
            caboObj.raiz.visible = false;
            fioTesteEsq.visible = true;
            fioTesteDir.visible = true;

            menino.raiz.position.set(0, 0.25, 0.15);
            menino.raiz.rotation.y = 0;

            var tQuebra = 5.65;
            if (t < tQuebra) {
              M.humor(menino, 'esforco');
              var tensao = M.faixa(t, 4.35, tQuebra);
              var vib = Math.sin(t * 55) * 0.022 * tensao;
              fioTesteEsq.position.set(-0.42 - tensao * 0.05, 1.15 + vib, 0.65);
              fioTesteDir.position.set(0.42 + tensao * 0.05, 1.15 - vib, 0.65);
              fioTesteEsq.rotation.z = Math.PI / 2 + tensao * 0.12;
              fioTesteDir.rotation.z = Math.PI / 2 - tensao * 0.12;
              menino.bracoE.rotation.set(-1.2, 0, 0.45);
              menino.bracoD.rotation.set(-1.2, 0, -0.45);
              luzFalha.intensity = tensao * 1.5;
            } else {
              // O vidro rachou!
              var uPos = M.suave(M.faixa(t, tQuebra, tQuebra + 0.8));
              M.humor(menino, 'assustado');
              M.suar(menino, t, tQuebra, DUR);
              fioTesteEsq.position.set(-0.52 - uPos * 0.35, 1.15 - uPos * 0.45, 0.65);
              fioTesteDir.position.set(0.52 + uPos * 0.35, 1.15 - uPos * 0.45, 0.65);
              fioTesteEsq.rotation.z = Math.PI / 2 + 0.65 * uPos;
              fioTesteDir.rotation.z = Math.PI / 2 - 0.65 * uPos;
              menino.bracoE.rotation.set(-0.8, 0, 1.1);
              menino.bracoD.rotation.set(-0.8, 0, -1.1);
              luzFalha.intensity = 2.4 * (0.6 + 0.4 * Math.sin(t * 14));
            }

            M.plano(
              palco.camera,
              t,
              4.35,
              DUR,
              { pos: [0.0, 1.75, 5.5], alvo: [0.0, 1.15, 0.2] },
              { pos: [0.1, 1.68, 5.1], alvo: [0.0, 1.15, 0.2] }
            );
            M.tremer(palco.camera, t, tQuebra, 0.45, 0.10);
          }
        }, { duracao: DUR, offsetGlobal: 0.00 });
      }

      window.__timelines = window.__timelines || {};
      window.__timelines['frame-01-gancho-abismo'] = tl;
    })();
  </script>
