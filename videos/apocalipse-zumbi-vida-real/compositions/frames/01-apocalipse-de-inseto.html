          for (var i = 0; i < 6; i++) {
            var j0 = juntas[i];
            var ang = j0[2] + anda * 7 * j0[3];
            perna[i].setAttribute('x2', f2(j0[0] + Math.cos(ang * Math.PI / 180) * 46));

          folha.setAttribute('opacity', f2(revela));
          formiga.setAttribute('opacity', f2(revela));
          formiga.setAttribute('transform', 'translate(760 452) scale(' + f2(0.9 + 0.1 * revela) + ') translate(-760 -452)');

          var corta = suave(faixa(t, P2 + 0.25, P2 + 0.85));
          xis.setAttribute('opacity', f2(corta));

          var cresce = suave(faixa(t, 9.15, 10.45));
          fungo.setAttribute('opacity', f2(cresce));
          hifa.setAttribute('stroke-dasharray', '150');
          hifa.setAttribute('stroke-dashoffset', f2(150 * (1 - cresce)));
          bulbo.setAttribute('r', f2(4 + 12 * cresce));

            var nasce = faixa(t, 9.6 + k * 0.06, 10.1 + k * 0.06);
            var sobe = faixa(t, 9.6 + k * 0.06, 12.7 + k * 0.06);
            var px2 = 700 + (M.ruido(k * 3.7) - 0.5) * 150;
            var py2 = 300 - sobe * (90 + M.ruido(k * 5.1) * 120) + Math.sin(t * 1.6 + k) * 8;

            esporo[k].setAttribute('cy', f2(py2));
            esporo[k].setAttribute('opacity', f2(nasce * (1 - sobe) * 0.85));
            esporo[k].setAttribute('r', f2(2.2 + M.ruido(k) * 1.8));
