        // ── janela do bunker com cidade apagada ──────────────────────────

        var itens =

          G({ id: 's6-remedio' },
            T('rect', { x: 236, y: 448, width: 92, height: 76, rx: 10, fill: '#2a1420', stroke: '#f87171', 'stroke-width': 2.5 }) +
            T('rect', { x: 250, y: 462, width: 64, height: 48, rx: 6, fill: '#3b1b28', stroke: '#fb7185', 'stroke-width': 1.5 }) +
            T('circle', { cx: 268, cy: 478, r: 6, fill: '#fda4af' }) +

            T('circle', { cx: 268, cy: 498, r: 6, fill: '#fda4af' }) +
            T('circle', { cx: 296, cy: 498, r: 6, fill: '#fda4af' }) +
            T('text', { x: 282, y: 560, 'text-anchor': 'middle', fill: '#fca5a5', 'font-family': 'Inter', 'font-size': 14, 'font-weight': 700, 'letter-spacing': 1.4 }, 'REMÉDIO')) +
          // lanterna apagando

            T('circle', { id: 's6-led', cx: 424, cy: 507, r: 5, fill: '#facc15' }) +
            T('text', { x: 394, y: 560, 'text-anchor': 'middle', fill: '#fde68a', 'font-family': 'Inter', 'font-size': 14, 'font-weight': 700, 'letter-spacing': 1.4 }, 'ENERGIA'));

        var barras = [
          { y: 236, rot: 'ENERGIA', cor: '#facc15', t: ENERGIA },
          { y: 312, rot: 'ÁGUA', cor: '#38bdf8', t: AGUA },
          { y: 388, rot: 'REMÉDIO', cor: '#f87171', t: REMEDIO }
        ];
        var medidores = '';
        for (var i = 0; i < barras.length; i++) {
          var by = barras[i].y;
          medidores += G({ id: 's6-med' + i },
            T('text', { x: 540, y: by + 18, fill: '#94a3b8', 'font-family': 'Inter', 'font-size': 18, 'font-weight': 700, 'letter-spacing': 1.8 }, barras[i].rot) +
            T('text', { id: 's6-pct' + i, x: 1012, y: by + 18, 'text-anchor': 'end', fill: barras[i].cor, 'font-family': 'Inter', 'font-size': 20, 'font-weight': 700 }, '100%') +
            T('rect', { x: 540, y: by + 30, width: 472, height: 16, rx: 8, fill: '#111827', stroke: '#334155', 'stroke-width': 1.5 }) +
            T('rect', { id: 's6-bar' + i, x: 543, y: by + 33, width: 466, height: 10, rx: 5, fill: barras[i].cor }));
        }

        var svg = M.svgBase(1080, 780,
          '<defs>' +
          '<radialGradient id="s6-luz"><stop offset="0" stop-color="#facc15" stop-opacity="0.20"/><stop offset="1" stop-color="#facc15" stop-opacity="0"/></radialGradient>' +
          '<linearGradient id="s6-parede" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141c29"/><stop offset="1" stop-color="#0a111c"/></linearGradient>' +
          '</defs>' +
          T('rect', { x: 40, y: 10, width: 1000, height: 760, rx: 26, fill: '#060910', stroke: '#2a2a1c', 'stroke-width': 3 }) +

          // parede / janela
          T('rect', { x: 68, y: 46, width: 424, height: 640, rx: 18, fill: 'url(#s6-parede)', stroke: '#2a3444', 'stroke-width': 2 }) +
          T('text', { x: 90, y: 84, fill: '#facc15', 'font-family': 'Inter', 'font-size': 16, 'font-weight': 700, 'letter-spacing': 2.4 }, 'BUNKER // DIA 1') +
          T('rect', { x: 90, y: 100, width: 380, height: 240, rx: 8, fill: '#03070f', stroke: '#334155', 'stroke-width': 4 }) +
          predios +
          T('circle', { cx: 420, cy: 140, r: 26, fill: '#e2e8f0', opacity: 0.16 }) +
          T('line', { x1: 90, y1: 220, x2: 470, y2: 220, stroke: '#334155', 'stroke-width': 3 }) +
          T('line', { x1: 280, y1: 100, x2: 280, y2: 340, stroke: '#334155', 'stroke-width': 3 }) +

          T('rect', { x: 90, y: 524, width: 380, height: 14, rx: 6, fill: '#1e293b', stroke: '#334155', 'stroke-width': 1.5 }) +
          itens +
          T('text', { x: 280, y: 660, 'text-anchor': 'middle', fill: '#8494a8', 'font-family': 'Inter', 'font-size': 15, 'font-weight': 700, 'letter-spacing': 1.6 }, '1 QUARTO  //  0 REPOSIÇÃO  //  NENHUMA SAÍDA') +

          // painel de suprimentos
          T('rect', { x: 508, y: 46, width: 532, height: 640, rx: 18, fill: '#070d16', stroke: '#2a3444', 'stroke-width': 2 }) +
          T('text', { x: 540, y: 96, fill: '#facc15', 'font-family': 'Inter', 'font-size': 16, 'font-weight': 700, 'letter-spacing': 2.4 }, 'SUPRIMENTOS SEM REPOSIÇÃO') +
          T('text', { x: 540, y: 190, fill: '#f8fafc', 'font-family': 'EB Garamond, serif', 'font-size': 86, 'font-weight': 700 }, 'DIA 1') +

          T('text', { x: 540, y: 474, fill: '#8494a8', 'font-family': 'Inter', 'font-size': 16, 'font-weight': 700, 'letter-spacing': 1.4 }, 'CADA DIA SEM REPOSIÇÃO É UM DIA A MENOS') +
          T('line', { x1: 540, y1: 496, x2: 1012, y2: 496, stroke: '#233247', 'stroke-width': 2 }) +
          T('text', { x: 540, y: 528, fill: '#facc15', 'font-family': 'Inter', 'font-size': 16, 'font-weight': 700, 'letter-spacing': 2.4 }, 'REGRA DOS 3') +

          T('text', { x: 540, y: 630, fill: '#cbd5e1', 'font-family': 'Inter', 'font-size': 22 }, '3 semanas sem comida') +

          // ── CTA final ──────────────────────────────────────────────────
          G({ id: 's6-cta', opacity: 0 },
            T('rect', { x: 60, y: 34, width: 960, height: 712, rx: 26, fill: '#050a12', 'fill-opacity': 0.97, stroke: '#facc15', 'stroke-width': 3 }) +
            T('text', { x: 540, y: 112, 'text-anchor': 'middle', fill: '#facc15', 'font-family': 'Inter', 'font-size': 19, 'font-weight': 700, 'letter-spacing': 4 }, 'A PERGUNTA QUE FICA') +
            T('text', { x: 540, y: 250, 'text-anchor': 'middle', fill: '#f8fafc', 'font-family': 'EB Garamond, serif', 'font-size': 108, 'font-weight': 700 }, 'QUANTOS DIAS?') +
            T('rect', { x: 320, y: 282, width: 440, height: 4, rx: 2, fill: '#facc15', opacity: 0.7 }) +
            T('text', { x: 540, y: 362, 'text-anchor': 'middle', fill: '#e2e8f0', 'font-family': 'Inter', 'font-size': 34 }, 'você acha que conseguiria sobreviver?') +
            T('rect', { id: 's6-pill', x: 250, y: 418, width: 580, height: 84, rx: 18, fill: '#facc15' }) +
            T('text', { x: 540, y: 472, 'text-anchor': 'middle', fill: '#1c1917', 'font-family': 'Inter', 'font-size': 34, 'font-weight': 700, 'letter-spacing': 1 }, 'SIGA O @OCURIORISANDO') +
            T('text', { x: 540, y: 556, 'text-anchor': 'middle', fill: '#cbd5e1', 'font-family': 'Inter', 'font-size': 28, 'font-weight': 400 }, 'e veja no próximo vídeo') +
            T('text', { x: 540, y: 646, 'text-anchor': 'middle', fill: '#8494a8', 'font-family': 'Inter', 'font-size': 18, 'font-weight': 700, 'letter-spacing': 2.4 }, 'SEM ENERGIA  //  SEM ÁGUA  //  SEM REMÉDIO')) +

          T('rect', { x: 40, y: 10, width: 1000, height: 760, rx: 26, fill: 'none', stroke: '#3d3a22', 'stroke-width': 3 })
        );
        M.montar('#f6-cena', svg);

        var cena = M.pegar('#f6-cena');
        var bar = [], pct = [];
        for (var i = 0; i < 3; i++) {
          bar.push(M.pegar(cena, '#s6-bar' + i));
          pct.push(M.pegar(cena, '#s6-pct' + i));
        }
        var led = M.pegar(cena, '#s6-led');
        var agua = M.pegar(cena, '#s6-agua');
        var cta = M.pegar(cena, '#s6-cta');
        var pill = M.pegar(cena, '#s6-pill');

        // nós de fundo que somem quando o CTA entra
        var fundo = [];
        var nos = cena.querySelectorAll('svg > *');
        for (var ns = 0; ns < nos.length; ns++) {
          if (nos[ns].id === 's6-cta' || nos[ns].tagName.toLowerCase() === 'defs') continue;
          fundo.push(nos[ns]);
        }

        var alvos = [0.06, 0.09, 0.02];

        M.conectar(tl, function (t, og) {
          // medidores caem
          for (var i = 0; i < 3; i++) {
            var ini = barras[i].t;
            var cai = suave(faixa(t, ini, ini + 0.85));
            var v = lerp(1, alvos[i], cai);
            bar[i].setAttribute('width', f2(466 * v));
            pct[i].textContent = Math.round(v * 100) + '%';
            pct[i].setAttribute('fill', cai > 0.6 ? '#f87171' : barras[i].cor);
          }

          // água baixa e LED piscando
          agua.setAttribute('opacity', f2(0.7 * (1 - 0.8 * suave(faixa(t, AGUA, AGUA + 0.9)))));
          var pisca = 0.35 + 0.65 * Math.abs(Math.sin(t * 9));
          led.setAttribute('opacity', f2(pisca * (1 - 0.7 * suave(faixa(t, ENERGIA, ENERGIA + 1.0)))));
          led.setAttribute('fill', t > ENERGIA + 0.6 ? '#f87171' : '#facc15');

          // CTA
          var on = suave(faixa(t, CTA, CTA + 0.45));
          cta.setAttribute('opacity', f2(on));
          for (var s = 0; s < fundo.length; s++) {
            fundo[s].setAttribute('opacity', f2(1 - on));
            fundo[s].style.display = on > 0.985 ? 'none' : '';
          }
          var pop = suave(faixa(t, CTA + 0.1, CTA + 0.9));
          cta.setAttribute('transform', 'translate(540 400) scale(' + f2(0.965 + 0.035 * pop) + ') translate(-540 -400)');
          var bat = t > CTA + 1.2 ? 0.5 + 0.5 * Math.sin((t - CTA) * 5.2) : 0;
          pill.setAttribute('fill', M.mixCor('#facc15', '#fde047', bat * 0.8));
          pill.setAttribute('stroke', 'rgba(28,25,23,0.25)');
          pill.setAttribute('stroke-width', '2');
        }, { duracao: DUR, offsetGlobal: 71.89 });
      }

      window.__timelines = window.__timelines || {};
      window.__timelines['frame-06-quantos-dias'] = tl;
    })();
  </script>
