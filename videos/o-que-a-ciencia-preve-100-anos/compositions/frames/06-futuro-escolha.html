      var T_ESCOLHA = 8.6;

        // relógio 2126
        var ticks = '';
        for (var tk = 0; tk < 12; tk++) {
          var ang = (tk / 12) * Math.PI * 2 - Math.PI / 2;

            T('circle', { cx: 540, cy: 104, r: 64, fill: 'rgba(6,14,26,0.95)', stroke: '#38bdf8', 'stroke-width': 4 }) +
            ticks +
            T('line', { id: 's6-ponteiroH', x1: 540, y1: 104, x2: 540, y2: 70, stroke: '#f8fafc', 'stroke-width': 5, 'stroke-linecap': 'round' }) +

            T('circle', { cx: 540, cy: 104, r: 5, fill: '#fbbf24' }) +
            T('text', { x: 540, y: 200, 'text-anchor': 'middle', fill: '#bae6fd', 'font-family': 'Inter, sans-serif', 'font-size': 18, 'font-weight': 700, 'letter-spacing': 4.0 }, '2126'));

        // estrada em forquilha

          G({ id: 's6-estrada' },
            T('path', { d: 'M540 640 C540 560 470 500 410 430 C360 370 340 320 336 280', fill: 'none', stroke: '#1e293b', 'stroke-width': 86, 'stroke-linecap': 'round' }) +
            T('path', { d: 'M540 640 C540 560 610 500 670 430 C720 370 740 320 744 280', fill: 'none', stroke: '#14532d', 'stroke-width': 86, 'stroke-linecap': 'round' }) +
            T('path', { d: 'M540 640 C540 560 470 500 410 430 C360 370 340 320 336 280', fill: 'none', stroke: '#f59e0b', 'stroke-width': 3, 'stroke-dasharray': '18 18', opacity: 0.45 }) +

        // lado seco: árvores mortas, rachaduras, sol vermelho

          G({ id: 's6-seco' },
            T('circle', { cx: 180, cy: 160, r: 58, fill: '#7f1d1d', opacity: 0.55 }) +
            T('circle', { cx: 180, cy: 160, r: 34, fill: '#ef4444', opacity: 0.65 }) +
            T('path', { d: 'M300 560 L300 420 M300 470 L274 440 M300 490 L332 458 M300 440 L324 414', fill: 'none', stroke: '#3f2a1a', 'stroke-width': 9, 'stroke-linecap': 'round' }) +
            T('path', { d: 'M450 560 L450 460 M450 500 L424 476 M450 486 L476 462', fill: 'none', stroke: '#3f2a1a', 'stroke-width': 8, 'stroke-linecap': 'round' }) +
            T('path', { d: 'M0 600 L120 590 L200 606 L300 596 L400 610 L520 600', fill: 'none', stroke: '#7c2d12', 'stroke-width': 3, opacity: 0.6 }) +
            T('path', { d: 'M40 620 L140 612 L240 624 L360 614 L480 626', fill: 'none', stroke: '#7c2d12', 'stroke-width': 2, opacity: 0.4 }) +
            T('text', { x: 120, y: 240, 'text-anchor': 'middle', fill: '#fca5a5', 'font-family': 'Inter, sans-serif', 'font-size': 14, 'font-weight': 700, 'letter-spacing': 1.0 }, 'SEGUIR COMO ESTÁ'));

        // lado verde: árvores, turbina, cidade limpa
        var verde =
          G({ id: 's6-verde' },
            T('circle', { cx: 900, cy: 150, r: 70, fill: '#fbbf24', opacity: 0.22 }) +
            T('circle', { cx: 900, cy: 150, r: 40, fill: '#fde68a', opacity: 0.6 }) +
            T('path', { d: 'M830 560 L830 420 M830 470 L800 440 M830 490 L862 458 M830 440 L854 414', fill: 'none', stroke: '#166534', 'stroke-width': 9, 'stroke-linecap': 'round' }) +
            T('circle', { cx: 830, cy: 410, r: 34, fill: '#22c55e', opacity: 0.8 }) +
            T('circle', { cx: 800, cy: 424, r: 24, fill: '#4ade80', opacity: 0.7 }) +
            T('circle', { cx: 858, cy: 426, r: 22, fill: '#16a34a', opacity: 0.7 }) +
            T('path', { d: 'M960 560 L960 470 M960 500 L936 480 M960 486 L984 466', fill: 'none', stroke: '#166534', 'stroke-width': 7, 'stroke-linecap': 'round' }) +
            T('circle', { cx: 960, cy: 460, r: 26, fill: '#22c55e', opacity: 0.75 }) +
            T('line', { x1: 700, y1: 560, x2: 700, y2: 400, stroke: '#cbd5e1', 'stroke-width': 4 }) +
            G({ id: 's6-turbina', transform: 'rotate(0 700 400)' },
              T('path', { d: 'M700 400 L700 340 M700 400 L752 430 M700 400 L648 430', stroke: '#e2e8f0', 'stroke-width': 6, 'stroke-linecap': 'round' }) +

            T('text', { x: 960, y: 240, 'text-anchor': 'middle', fill: '#bbf7d0', 'font-family': 'Inter, sans-serif', 'font-size': 14, 'font-weight': 700, 'letter-spacing': 1.0 }, 'MUDAR AGORA'));

          '<defs>' +
          '<radialGradient id="s6-vinhetaGrad" cx="0.5" cy="0.45" r="0.7"><stop offset="0" stop-color="#050a14" stop-opacity="0"/><stop offset="1" stop-color="#050a14" stop-opacity="0.55"/></radialGradient>' +
          '</defs>' +
          fundo + seco + verde + estrada + relogio + alavanca + interrogacao + selo
        );
        M.montar('#f6-cena', svg);
        var cena = M.pegar('#f6-cena');
        var ponteiroH = M.pegar(cena, '#s6-ponteiroH');
        var ponteiroM = M.pegar(cena, '#s6-ponteiroM');
        var haste = M.pegar(cena, '#s6-haste');
        var turbina = M.pegar(cena, '#s6-turbina');
        var seloEl = M.pegar(cena, '#s6-selo');
        var interEl = M.pegar(cena, '#s6-interrogacao');
        var secoEl = M.pegar(cena, '#s6-seco');
        var verdeEl = M.pegar(cena, '#s6-verde');
        var boy = M.mascote('#f6-mascote');
        var hud = M.medidorBarra('#f6-hud', { rotulo: 'FUTURO EM ABERTO', unidade: '%', max: 100, cor: '#38bdf8', decimais: 0 });

        M.conectar(tl, function (t, og) {
          // relógio acelera
          var giro = suave(faixa(t, T_RELOGIO, 6.0));
          ponteiroH.setAttribute('transform', 'rotate(' + f2(giro * 40 + t * 0.6) + ' 540 104)');
          ponteiroM.setAttribute('transform', 'rotate(' + f2(t * 12) + ' 540 104)');

          // alavanca pende entre os dois lados e escolhe o verde
          var balanco = Math.sin(t * 1.2) * 14 * (1 - suave(faixa(t, T_ESCOLHA, T_ESCOLHA + 1.0)));
          var escolha = suave(faixa(t, T_ESCOLHA, T_ESCOLHA + 1.4));
          var angulo = lerp(balanco, 38, escolha);
          haste.setAttribute('transform', 'rotate(' + f2(angulo) + ' 540 470)');

          // lado verde ganha vida
          var kv = suave(faixa(t, T_VERDE, T_VERDE + 2.0));
          verdeEl.setAttribute('opacity', f2(0.72 + 0.28 * kv));
          secoEl.setAttribute('opacity', f2(1 - 0.18 * kv));
          turbina.setAttribute('transform', 'rotate(' + f2(t * 90) + ' 700 400)');

          var pulso = 0.7 + 0.3 * Math.sin(t * 2.4);
          interEl.setAttribute('opacity', f2(pulso * (1 - escolha * 0.55)));

          var ks = suave(faixa(t, T_SELO, T_SELO + 0.7));
          seloEl.setAttribute('opacity', f2(ks));
          seloEl.setAttribute('transform', 'translate(318 512) scale(' + f2(lerp(0.6, 1, ks)) + ') translate(-318 -512)');

          hud.atualizar(lerp(0, 100, suave(faixa(t, 1.2, 8.5))), t > 9.2 ? 'DEPENDE DE HOJE' : 'EM ABERTO', t > 9.2 ? '#fbbf24' : '#38bdf8');

          boy.atualizar(t, og, {
            humor: t > T_ESCOLHA ? 'feliz' : 'neutro',
            bracoD: t > T_ESCOLHA ? 120 : 36,
            bracoE: t > T_ESCOLHA ? 26 : 10,
            olhar: t > T_ESCOLHA ? [14, -4] : [4, -2],
            inclinar: t > T_ESCOLHA ? -3 : 1,
            pulo: t > T_BANNER ? Math.abs(Math.sin((t - T_BANNER) * 4.3)) * 10 : 0
          });
        }, { duracao: DUR, offsetGlobal: 121.68 });
      }

      window.__timelines = window.__timelines || {};
      window.__timelines['frame-06-futuro-escolha'] = tl;
    })();
