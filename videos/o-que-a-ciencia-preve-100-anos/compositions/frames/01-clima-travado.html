<template>
  <style>
    @font-face { font-family:'EB Garamond'; font-style:normal; font-weight:400; font-display:swap; src:url('assets/fonts/EBGaramond-400.woff2') format('woff2'); }
    @font-face { font-family:'EB Garamond'; font-style:normal; font-weight:700; font-display:swap; src:url('assets/fonts/EBGaramond-700.woff2') format('woff2'); }
    @font-face { font-family:'Inter'; font-style:normal; font-weight:400; font-display:swap; src:url('assets/fonts/Inter-400.woff2') format('woff2'); }
    @font-face { font-family:'Inter'; font-style:normal; font-weight:700; font-display:swap; src:url('assets/fonts/Inter-700.woff2') format('woff2'); }

    #f1-root { position:absolute; inset:0; width:1080px; height:1920px; overflow:hidden; background-color:#050a14; font-family:'Inter',sans-serif; color:#f8fafc; }
    .f1-ui-layer { position:absolute; inset:0; z-index:3; pointer-events:none; }
    .f1-topbar { position:absolute; top:76px; left:64px; right:64px; height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 26px; background:rgba(6,14,26,0.90); border:1px solid rgba(56,189,248,0.38); border-radius:14px; }
    .f1-kicker { font-size:20px; font-weight:700; letter-spacing:.12em; color:#7dd3fc; text-transform:uppercase; }
    .f1-badge { font-size:19px; font-weight:700; color:#fbbf24; letter-spacing:.06em; }
    .f1-header-card { position:absolute; top:164px; left:64px; right:64px; padding:24px 32px 26px; background:rgba(6,14,26,0.90); border-left:5px solid #fb923c; border-radius:0 18px 18px 0; box-shadow:0 20px 50px rgba(0,0,0,0.55); }
    .f1-title { font-family:'EB Garamond',serif; font-size:54px; font-weight:700; line-height:1.04; color:#f8fafc; margin-bottom:8px; }
    .f1-title-accent { color:#fdba74; }
    .f1-subtitle { font-size:22px; line-height:1.34; color:#e2e8f0; }
    .f1-banner { position:absolute; top:1248px; left:64px; right:140px; padding:15px 24px; background:rgba(6,16,30,0.94); border:1.5px solid rgba(251,146,60,0.6); border-radius:14px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .f1-banner-text { font-size:19px; font-weight:700; color:#fed7aa; letter-spacing:.03em; line-height:1.25; }
    .f1-banner-pill { flex:0 0 auto; padding:7px 15px; background:#fb923c; color:#1a0b03; font-size:16px; font-weight:700; border-radius:8px; letter-spacing:.06em; }
    #f1-root .m2-fundo { position:absolute; inset:0; z-index:0; background:radial-gradient(circle at 76% 18%, #3a1c10 0%, #14253c 46%, #050a14 100%); }
    #f1-root .m2-piso { position:absolute; left:0; top:1440px; width:1080px; height:480px; z-index:0; background:linear-gradient(180deg,#120d0a 0%,#050a14 100%); border-top:2px solid rgba(251,146,60,0.18); }
    #f1-root .m2-cena { position:absolute; left:0; top:344px; width:1080px; height:640px; z-index:1; }
    #f1-root .m2-mascote { position:absolute; left:16px; top:640px; width:236px; height:330px; z-index:2; }
    #f1-root .m2-hud { position:absolute; left:356px; top:1000px; width:584px; height:232px; z-index:2; background:rgba(6,14,26,0.92); border:1px solid rgba(251,146,60,0.32); border-radius:22px; }
  </style>

  <div id="f1-root" data-composition-id="frame-01-clima-travado" data-width="1080" data-height="1920" data-start="0" data-duration="21.25">
    <div class="m2-fundo"></div>
    <div class="m2-piso"></div>
    <div id="f1-cena" class="m2-cena"></div>
    <div id="f1-mascote" class="m2-mascote"></div>
    <div id="f1-hud" class="m2-hud"></div>

    <div class="f1-ui-layer">
      <div id="f1-topbar" class="f1-topbar">
        <span class="f1-kicker">2126 // O FUTURO JÁ COMEÇOU</span>
        <span class="f1-badge">+0,6 m</span>
      </div>
      <div id="f1-header" class="f1-header-card">
        <h1 class="f1-title">O Futuro Já Está <span class="f1-title-accent">no Ar</span></h1>
        <p class="f1-subtitle">Parte do aquecimento dos próximos 100 anos já foi emitida — e vai ficar séculos na atmosfera.</p>
      </div>
      <div id="f1-banner" class="f1-banner" style="opacity: 0;">
        <span class="f1-banner-text">PARTE DO AQUECIMENTO JÁ É CERTA</span>
        <span class="f1-banner-pill">2126</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var DUR = 21.25;
      var T_TERMO = 1.6;
      var T_CADEADO = 5.4;
      var T_PUFFS = 7.4;
      var T_BANNER = 19.4;

      var tl = gsap.timeline({ paused: true });

      tl.fromTo('#f1-topbar', { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.08);
      tl.fromTo('#f1-header', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: 'power3.out' }, 0.20);
      tl.fromTo('#f1-banner', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: 'back.out(1.6)' }, T_BANNER);

      var M = window.Motor2D;
      if (M) {
        var T = M.T, G = M.G, lerp = M.lerp, suave = M.suave, faixa = M.faixa, f2 = M.f2;

        // céu quente
        var ceu =
          T('rect', { x: 0, y: 0, width: 1080, height: 640, fill: '#0a1526' }) +
          T('rect', { x: 0, y: 0, width: 1080, height: 640, fill: 'url(#s1-ceuGrad)' });

        // sol com raios
        var raios = '';
        for (var r = 0; r < 14; r++) {
          var ang = (r / 14) * Math.PI * 2;
          var x1 = 844 + Math.cos(ang) * 78, y1 = 108 + Math.sin(ang) * 78;
          var x2 = 844 + Math.cos(ang) * 108, y2 = 108 + Math.sin(ang) * 108;
          raios += T('line', { id: 's1-raio' + r, x1: f2(x1), y1: f2(y1), x2: f2(x2), y2: f2(y2), stroke: '#fbbf24', 'stroke-width': 4, 'stroke-linecap': 'round', opacity: 0.65 });
        }
        var sol =
          G({ id: 's1-sol' },
            T('circle', { cx: 844, cy: 108, r: 96, fill: 'url(#s1-solGrad)' }) +
            raios +
            T('circle', { cx: 844, cy: 108, r: 56, fill: '#fbbf24' }) +
            T('circle', { cx: 826, cy: 92, r: 14, fill: '#fde68a', opacity: 0.7 }));

        // domo de calor
        var domo =
          T('path', { id: 's1-domo', d: 'M300 430 C300 180 470 60 700 60 C930 60 1000 200 1000 430', fill: 'none', stroke: '#fb923c', 'stroke-width': 4, 'stroke-dasharray': '16 14', opacity: 0.35 });

        // cidade
        var predios = [
          { x: 318, y: 392, w: 92, h: 228 },
          { x: 420, y: 340, w: 76, h: 280 },
          { x: 506, y: 418, w: 104, h: 202 },
          { x: 620, y: 366, w: 84, h: 254 },
          { x: 714, y: 300, w: 72, h: 320 },
          { x: 796, y: 404, w: 96, h: 216 },
          { x: 902, y: 356, w: 72, h: 264 }
        ];
        var cidade = '';
        predios.forEach(function (p, i) {
          cidade += T('rect', { x: p.x, y: p.y, width: p.w, height: p.h, rx: 3, fill: i % 2 ? '#0b1a2c' : '#0d2034', stroke: '#1e3a5f', 'stroke-width': 1.5 });
          for (var wy = p.y + 18; wy < p.y + p.h - 16; wy += 34) {
            for (var wx = p.x + 14; wx < p.x + p.w - 14; wx += 26) {
              cidade += T('rect', { id: 's1-jan' + i + '-' + Math.round(wy) + '-' + Math.round(wx), x: wx, y: wy, width: 10, height: 12, rx: 2, fill: '#fbbf24', opacity: 0.18 });
            }
          }
        });

        // asfalto e ondas de calor
        var asfalto =
          T('rect', { x: 0, y: 600, width: 1080, height: 40, fill: '#080d16' }) +
          T('line', { x1: 0, y1: 620, x2: 1080, y2: 620, stroke: '#f59e0b', 'stroke-width': 3, 'stroke-dasharray': '34 28', opacity: 0.35 });
        var ondas = '';
        for (var o = 0; o < 3; o++) {
          ondas += T('path', { id: 's1-onda' + o, d: 'M0 592 Q90 574 180 592 T360 592 T540 592 T720 592 T900 592 T1080 592', fill: 'none', stroke: '#fb923c', 'stroke-width': 3, opacity: 0.16 });
        }

        // carros + nuvens de CO2
        var carro = function (x, y, cor) {
          return G({ transform: 'translate(' + x + ' ' + y + ')' },
            T('rect', { x: 0, y: 10, width: 96, height: 34, rx: 12, fill: cor }) +
            T('path', { d: 'M14 12 L30 -10 L66 -10 L82 12 Z', fill: cor, stroke: '#0b1220', 'stroke-width': 2 }) +
            T('rect', { x: 32, y: -6, width: 14, height: 14, rx: 3, fill: '#7dd3fc', opacity: 0.7 }) +
            T('rect', { x: 52, y: -6, width: 14, height: 14, rx: 3, fill: '#7dd3fc', opacity: 0.7 }) +
            T('circle', { cx: 22, cy: 46, r: 11, fill: '#0b1220', stroke: '#94a3b8', 'stroke-width': 3 }) +
            T('circle', { cx: 74, cy: 46, r: 11, fill: '#0b1220', stroke: '#94a3b8', 'stroke-width': 3 }));
        };
        var puffs = '';
        for (var p = 0; p < 6; p++) {
          puffs += T('circle', { id: 's1-puff' + p, cx: 0, cy: 0, r: 10 + p * 2, fill: '#cbd5e1', opacity: 0 });
        }
        var carros =
          G({ id: 's1-carroA', transform: 'translate(0 0)' }, carro(340, 552, '#ef4444')) +
          G({ id: 's1-carroB', transform: 'translate(0 0)' }, carro(650, 560, '#38bdf8')) +
          G({ id: 's1-puffs', 'data-layout-allow-overlap': 'true' }, puffs);

        // termômetro
        var termo =
          G({ id: 's1-termo' },
            T('rect', { x: 356, y: 92, width: 42, height: 356, rx: 21, fill: '#0b1220', stroke: '#e2e8f0', 'stroke-width': 4 }) +
            T('rect', { x: 368, y: 112, width: 18, height: 316, rx: 9, fill: '#111c33' }) +
            T('rect', { id: 's1-mercurio', x: 368, y: 400, width: 18, height: 28, rx: 9, fill: '#ef4444' }) +
            T('circle', { cx: 377, cy: 466, r: 30, fill: '#ef4444', stroke: '#fca5a5', 'stroke-width': 3 }) +
            T('line', { x1: 402, y1: 150, x2: 420, y2: 150, stroke: '#cbd5e1', 'stroke-width': 2 }) +
            T('line', { x1: 402, y1: 218, x2: 420, y2: 218, stroke: '#cbd5e1', 'stroke-width': 2 }) +
            T('line', { x1: 402, y1: 286, x2: 420, y2: 286, stroke: '#cbd5e1', 'stroke-width': 2 }) +
            T('line', { x1: 402, y1: 354, x2: 420, y2: 354, stroke: '#cbd5e1', 'stroke-width': 2 }) +
            T('text', { x: 428, y: 156, fill: '#fca5a5', 'font-family': 'Inter, sans-serif', 'font-size': 15, 'font-weight': 700 }, '3°C') +
            T('text', { x: 428, y: 224, fill: '#fbbf24', 'font-family': 'Inter, sans-serif', 'font-size': 15, 'font-weight': 700 }, '2°C') +
            T('text', { x: 428, y: 292, fill: '#fde68a', 'font-family': 'Inter, sans-serif', 'font-size': 15, 'font-weight': 700 }, '1,5°C') +
            T('text', { x: 428, y: 360, fill: '#bbf7d0', 'font-family': 'Inter, sans-serif', 'font-size': 15, 'font-weight': 700 }, '1°C'));

        // cadeado
        var cadeado =
          G({ id: 's1-cadeado', opacity: 0 },
            T('path', { d: 'M688 206 L688 184 C688 158 714 144 736 158 C748 166 752 176 752 184 L752 206', fill: 'none', stroke: '#fbbf24', 'stroke-width': 10, 'stroke-linecap': 'round' }) +
            T('rect', { x: 670, y: 202, width: 100, height: 82, rx: 14, fill: 'rgba(6,14,26,0.96)', stroke: '#fbbf24', 'stroke-width': 4 }) +
            T('circle', { cx: 720, cy: 234, r: 9, fill: '#fbbf24' }) +
            T('rect', { x: 716, y: 240, width: 8, height: 20, rx: 4, fill: '#fbbf24' }));

        // etiqueta do travado
        var tagTravado =
          G({ id: 's1-tagTravado', opacity: 0 },
            T('rect', { x: 540, y: 306, width: 360, height: 48, rx: 10, fill: 'rgba(6,14,26,0.95)', stroke: '#fbbf24', 'stroke-width': 2 }) +
            T('text', { x: 720, y: 337, 'text-anchor': 'middle', fill: '#fde68a', 'font-family': 'Inter, sans-serif', 'font-size': 17, 'font-weight': 700, 'letter-spacing': 0.8 }, 'PARTE DO FUTURO JÁ ESTÁ TRAVADA'));

        // ventilador ao lado do mascote
        var ventilador =
          G({ id: 's1-ventilador', transform: 'translate(282 558)' },
            T('rect', { x: -4, y: 34, width: 8, height: 42, rx: 4, fill: '#94a3b8' }) +
            T('ellipse', { cx: 0, cy: 80, rx: 26, ry: 7, fill: '#0b1220', stroke: '#94a3b8', 'stroke-width': 2 }) +
            T('circle', { cx: 0, cy: 0, r: 34, fill: '#0b1220', stroke: '#38bdf8', 'stroke-width': 3 }) +
            G({ id: 's1-helices' },
              T('path', { d: 'M0 0 C-8 -26 8 -30 0 -32 C-2 -20 -6 -10 0 0', fill: '#7dd3fc', opacity: 0.75 }) +
              T('path', { d: 'M0 0 C26 -8 30 8 32 0 C20 -2 10 -6 0 0', fill: '#7dd3fc', opacity: 0.75 }) +
              T('path', { d: 'M0 0 C8 26 -8 30 0 32 C2 20 6 10 0 0', fill: '#7dd3fc', opacity: 0.75 }) +
              T('path', { d: 'M0 0 C-26 8 -30 -8 -32 0 C-20 2 -10 6 0 0', fill: '#7dd3fc', opacity: 0.75 })) +
            T('circle', { cx: 0, cy: 0, r: 6, fill: '#e2e8f0' }));

        var svg = M.svgBase(1080, 640,
          '<defs>' +
          '<radialGradient id="s1-ceuGrad" cx="0.78" cy="0.16" r="0.78"><stop offset="0" stop-color="#7c2d12" stop-opacity="0.55"/><stop offset="0.45" stop-color="#3b1d12" stop-opacity="0.28"/><stop offset="1" stop-color="#050a14" stop-opacity="0"/></radialGradient>' +
          '<radialGradient id="s1-solGrad" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/><stop offset="0.5" stop-color="#f59e0b" stop-opacity="0.20"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>' +
          '</defs>' +
          ceu + sol + domo + cidade + asfalto + ondas + carros + termo + cadeado + tagTravado + ventilador
        );
        M.montar('#f1-cena', svg);
        var cena = M.pegar('#f1-cena');
        var solEl = M.pegar(cena, '#s1-sol');
        var domoEl = M.pegar(cena, '#s1-domo');
        var mercurio = M.pegar(cena, '#s1-mercurio');
        var cadeadoEl = M.pegar(cena, '#s1-cadeado');
        var tagTravadoEl = M.pegar(cena, '#s1-tagTravado');
        var helices = M.pegar(cena, '#s1-helices');
        var carroA = M.pegar(cena, '#s1-carroA');
        var carroB = M.pegar(cena, '#s1-carroB');
        var puffEls = [];
        for (var pf = 0; pf < 6; pf++) puffEls.push(M.pegar(cena, '#s1-puff' + pf));
        var raioEls = [];
        for (var rI = 0; rI < 14; rI++) raioEls.push(M.pegar(cena, '#s1-raio' + rI));
        var ondaEls = [];
        for (var oI = 0; oI < 3; oI++) ondaEls.push(M.pegar(cena, '#s1-onda' + oI));
        var janelas = cena.querySelectorAll('rect[id^="s1-jan"]');
        var boy = M.mascote('#f1-mascote');
        var hud = M.medidorBarra('#f1-hud', { rotulo: 'CO₂ JÁ EMITIDO', unidade: 'ANOS', max: 400, cor: '#fb923c', decimais: 0 });

        M.conectar(tl, function (t, og) {
          var pulsoSol = 1 + 0.035 * Math.sin(t * 2.2);
          solEl.setAttribute('transform', 'translate(844 108) scale(' + f2(pulsoSol) + ') translate(-844 -108)');
          for (var r2 = 0; r2 < 14; r2++) {
            raioEls[r2].setAttribute('opacity', f2(0.38 + 0.34 * (0.5 + 0.5 * Math.sin(t * 3 + r2 * 0.8))));
          }

          var calor = suave(faixa(t, T_TERMO, 19.0));
          domoEl.setAttribute('opacity', f2(0.22 + 0.38 * calor));
          domoEl.setAttribute('stroke-dashoffset', f2(-t * 22));

          var nivel = lerp(0, 1, suave(faixa(t, 0.8, 19.0)));
          var hMerc = 28 + nivel * 250;
          mercurio.setAttribute('y', f2(400 + 28 - hMerc));
          mercurio.setAttribute('height', f2(hMerc));

          for (var j = 0; j < janelas.length; j++) {
            var jEl = janelas[j];
            var base = 0.12 + M.ruido(j * 2.7) * 0.18;
            jEl.setAttribute('opacity', f2(base + 0.45 * (0.5 + 0.5 * Math.sin(t * 1.8 + j * 0.7)) * suave(faixa(t, 1.2, 4.0))));
          }

          var kc = suave(faixa(t, T_CADEADO, T_CADEADO + 0.7));
          cadeadoEl.setAttribute('opacity', f2(kc));
          cadeadoEl.setAttribute('transform', 'translate(720 244) scale(' + f2(lerp(0.7, 1, kc)) + ') translate(-720 -244)');
          tagTravadoEl.setAttribute('opacity', f2(suave(faixa(t, T_CADEADO + 0.5, T_CADEADO + 1.1))));

          helices.setAttribute('transform', 'rotate(' + f2(t * 520) + ')');

          var anda = Math.sin(t * 0.55) * 16;
          carroA.setAttribute('transform', 'translate(' + f2(anda) + ' 0)');
          carroB.setAttribute('transform', 'translate(' + f2(-anda * 0.7) + ' 0)');

          for (var p2 = 0; p2 < 6; p2++) {
            var fase = ((t * 0.42 + p2 / 6) % 1);
            var origemX = p2 < 3 ? 388 : 698;
            var origemY = p2 < 3 ? 540 : 548;
            puffEls[p2].setAttribute('cx', f2(origemX + Math.sin(t * 1.4 + p2) * 10));
            puffEls[p2].setAttribute('cy', f2(origemY - fase * 150));
            puffEls[p2].setAttribute('r', f2(7 + fase * 16));
            puffEls[p2].setAttribute('opacity', f2(Math.max(0, 0.5 * (1 - fase)) * suave(faixa(t, T_PUFFS, T_PUFFS + 0.8))));
          }

          for (var o2 = 0; o2 < 3; o2++) {
            ondaEls[o2].setAttribute('opacity', f2(0.10 + 0.12 * (0.5 + 0.5 * Math.sin(t * 2.6 + o2 * 1.1))));
            ondaEls[o2].setAttribute('stroke-dashoffset', f2(-t * 18 - o2 * 12));
          }

          hud.atualizar(lerp(0, 300, suave(faixa(t, 1.0, 19.0))), t > 18.0 ? 'AQUECIMENTO TRAVADO' : 'FICA NO AR', t > 18.0 ? '#fbbf24' : '#fb923c');

          boy.atualizar(t, og, {
            humor: 'surpreso',
            bracoD: t > 5 ? 74 : 34,
            bracoE: 10,
            olhar: [10, -2],
            inclinar: 2,
            tremer: t > 5 ? 0.6 : 0,
            pulo: 0
          });
        }, { duracao: DUR, offsetGlobal: 0.00 });
      }

      window.__timelines = window.__timelines || {};
      window.__timelines['frame-01-clima-travado'] = tl;
    })();
  </script>
</template>
