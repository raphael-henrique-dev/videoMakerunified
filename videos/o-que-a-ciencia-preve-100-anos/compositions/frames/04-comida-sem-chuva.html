        // fazenda vertical
        var fazenda =
          G({ id: 's4-fazenda' },
            T('rect', { x: 352, y: 58, width: 168, height: 524, rx: 16, fill: 'rgba(8,20,32,0.92)', stroke: '#4ade80', 'stroke-width': 3 }) +

        var prateleiras = '';
        var alfaces = '';

          for (var a = 0; a < 5; a++) {
            var ax = 386 + a * 24;
            alfaces +=
              G({ id: 's4-alfa' + s + '-' + a, transform: 'translate(' + ax + ' ' + (sy + 58) + ') scale(0.2)' },
                T('path', { d: 'M0 0 C-14 -4 -18 -22 -8 -30 C-2 -34 6 -34 12 -28 C22 -20 16 -2 0 0 Z', fill: a % 2 ? '#22c55e' : '#4ade80', stroke: '#86efac', 'stroke-width': 1.2 }) +

            T('line', { x1: 635, y1: 340, x2: 642, y2: 333, stroke: '#fde68a', 'stroke-width': 2 }) +
            T('rect', { x: 596, y: 580, width: 78, height: 14, rx: 7, fill: '#fbbf24', opacity: 0.4 }) +

        var bolhas = '';
        for (var b = 0; b < 14; b++) {
          bolhas += T('circle', { id: 's4-bolha' + b, cx: 0, cy: 0, r: 3 + (b % 4) * 1.6, fill: '#fde68a', opacity: 0 });

        // dessalinização
        var usina =
          G({ id: 's4-usina' },
            T('rect', { x: 760, y: 340, width: 180, height: 240, rx: 12, fill: 'rgba(8,20,32,0.94)', stroke: '#38bdf8', 'stroke-width': 3 }) +
            T('rect', { x: 776, y: 356, width: 148, height: 70, rx: 8, fill: '#0b1220', stroke: '#1e3a5f', 'stroke-width': 2 }) +
            T('path', { d: 'M776 420 L810 390 L844 420 L878 390 L912 420 L924 406', fill: 'none', stroke: '#38bdf8', 'stroke-width': 3, opacity: 0.7 }) +
            T('rect', { x: 776, y: 444, width: 64, height: 120, rx: 8, fill: '#0b1220', stroke: '#38bdf8', 'stroke-width': 2 }) +
            T('rect', { x: 784, y: 500, width: 48, height: 56, rx: 6, fill: '#0e7490' }) +
            T('rect', { x: 860, y: 444, width: 64, height: 120, rx: 8, fill: '#0b1220', stroke: '#38bdf8', 'stroke-width': 2 }) +
            T('rect', { x: 868, y: 468, width: 48, height: 88, rx: 6, fill: '#22d3ee', opacity: 0.7 }) +
            T('path', { d: 'M840 480 C848 480 852 486 852 494', fill: 'none', stroke: '#38bdf8', 'stroke-width': 5, 'stroke-linecap': 'round' }) +

        var gotas = '';

        // prato com hambúrguer e etiqueta de preço
        var prato =
          G({ id: 's4-prato' },

        var etiqueta =
          G({ id: 's4-etiqueta', transform: 'translate(940 120) rotate(8)' },

            T('path', { id: 's4-setaPreco', d: 'M-40 40 L-12 40 M-20 32 L-12 40 L-20 48', fill: 'none', stroke: '#4ade80', 'stroke-width': 3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0 }));

        var svg = M.svgBase(1080, 640,
          '<defs>' +
          '<radialGradient id="s4-fundoGrad" cx="0.42" cy="0.24" r="0.78"><stop offset="0" stop-color="#831843" stop-opacity="0.28"/><stop offset="0.55" stop-color="#0b2030" stop-opacity="0.12"/><stop offset="1" stop-color="#050a14" stop-opacity="0"/></radialGradient>' +
          '<linearGradient id="s4-caldoGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/><stop offset="1" stop-color="#7c2d12" stop-opacity="0.85"/></linearGradient>' +
          '</defs>' +
          fundo + nuvem + fazenda + prateleiras + leds + alfaces + biorreator + bolhas + usina + gotas + prato + etiqueta
        );
        M.montar('#f4-cena', svg);
        var cena = M.pegar('#f4-cena');
        var alfaEls = [];
        for (var s2 = 0; s2 < 4; s2++) for (var a2 = 0; a2 < 5; a2++) alfaEls.push(M.pegar(cena, '#s4-alfa' + s2 + '-' + a2));
        var ledEls = [];
        for (var l = 0; l < 4; l++) ledEls.push(M.pegar(cena, '#s4-led' + l));
        var bolhaEls = [];
        for (var b2 = 0; b2 < 14; b2++) bolhaEls.push(M.pegar(cena, '#s4-bolha' + b2));
        var gotaEls = [];
        for (var g2 = 0; g2 < 8; g2++) gotaEls.push(M.pegar(cena, '#s4-gota' + g2));
        var precoEl = M.pegar(cena, '#s4-preco');
        var setaPreco = M.pegar(cena, '#s4-setaPreco');
        var etiquetaEl = M.pegar(cena, '#s4-etiqueta');
        var boy = M.mascote('#f4-mascote');
        var hud = M.medidorBarra('#f4-hud', { rotulo: 'ÁGUA NA PROTEÍNA', unidade: '% MENOS', max: 100, cor: '#4ade80', decimais: 0 });

        M.conectar(tl, function (t, og) {
          // LEDs rosa pulsando
          for (var l2 = 0; l2 < 4; l2++) {
            ledEls[l2].setAttribute('opacity', f2(0.35 + 0.45 * (0.5 + 0.5 * Math.sin(t * 2.4 + l2 * 0.9))));
          }

          // alfaces crescem
          for (var a3 = 0; a3 < 20; a3++) {
            var s3 = Math.floor(a3 / 5);
            var kA = suave(faixa(t, T_FAZENDA + s3 * 0.55 + (a3 % 5) * 0.08, T_FAZENDA + s3 * 0.55 + 0.8));
            var elA = alfaEls[a3];
            if (elA) elA.setAttribute('transform', 'translate(' + (386 + (a3 % 5) * 24) + ' ' + (96 + s3 * 118 + 58) + ') scale(' + f2(lerp(0.2, 1, kA)) + ')');
          }

          // bolhas do biorreator
          for (var b3 = 0; b3 < 14; b3++) {
            var fase = ((t * 0.35 + b3 / 14) % 1);
            var bx = 590 + M.ruido(b3 * 3.1) * 90;
            bolhaEls[b3].setAttribute('cx', f2(bx + Math.sin(t * 1.8 + b3) * 6));
            bolhaEls[b3].setAttribute('cy', f2(560 - fase * 168));
            bolhaEls[b3].setAttribute('opacity', f2(0.65 * (1 - fase) * suave(faixa(t, T_BIOREATOR, T_BIOREATOR + 0.8))));
          }

          // gotas da dessalinização
          for (var g3 = 0; g3 < 8; g3++) {
            var fg = ((t * 0.55 + g3 / 8) % 1);
            var gx = 788 + (g3 % 4) * 30;
            gotaEls[g3].setAttribute('transform', 'translate(' + gx + ' ' + f2(470 + fg * 80) + ')');
            gotaEls[g3].setAttribute('opacity', f2(0.75 * (1 - fg) * suave(faixa(t, T_AGUA, T_AGUA + 0.7))));
          }

          // preço cai
          var kP = suave(faixa(t, T_PRECO, T_PRECO + 1.4));
          var preco = Math.round(lerp(40, 18, kP));
          precoEl.textContent = 'R$ ' + preco;
          setaPreco.setAttribute('opacity', f2(kP));
          etiquetaEl.setAttribute('transform', 'translate(940 120) rotate(' + f2(8 + Math.sin(t * 2.2) * 3) + ')');

          hud.atualizar(lerp(0, 90, suave(faixa(t, 1.0, 18.0))), t > 17.0 ? 'TANQUE, NÃO PASTO' : 'MENOS ÁGUA', t > 17.0 ? '#86efac' : '#4ade80');

          boy.atualizar(t, og, {
            humor: t > T_PRECO ? 'feliz' : 'surpreso',
            bracoD: t > T_PRECO ? 112 : 40,
            bracoE: 14,
            olhar: [8, -2],
            inclinar: -2,
            pulo: t > T_BANNER ? Math.abs(Math.sin((t - T_BANNER) * 4.1)) * 8 : 0
          });
        }, { duracao: DUR, offsetGlobal: 73.97 });
      }

      window.__timelines = window.__timelines || {};
      window.__timelines['frame-04-comida-sem-chuva'] = tl;
    })();
  </script>
