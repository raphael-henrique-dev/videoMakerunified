      if (window.THREE && window.Motor3D) {
        var THREE = window.THREE;
        var M = window.Motor3D;
        var palco = M.criarPalco3D(THREE, {
          container: '#f5-stage-3d',
          largura: 1080,
          altura: 1920,

        vizinhos.raiz.scale.setScalar(0.68);
        palco.cena.add(vizinhos.raiz);

        var menino = M.criarBoneco(THREE, { escala: 0.72 });

        palco.cena.add(menino.raiz);

          var cong = M.suave(M.faixa(t, 0.4, 8.0));

          if (t < 5.5) {
            M.pensar(menino, t, 0.2, 5.5);

            M.suar(menino, t, 5.5, DUR);
            M.apontar(menino, [0.28, 1.35, 0.0], 'D');
