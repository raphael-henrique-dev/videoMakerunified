    (function () {
      var DUR = 17.77;
      var tl = gsap.timeline({ paused: true });

      tl.fromTo('#f3-topbar', { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.08);

      if (window.THREE && window.Motor3D) {
        var THREE = window.THREE;
        var M = window.Motor3D;
        var palco = M.criarPalco3D(THREE, {
          container: '#f3-stage-3d',
          largura: 1080,
          altura: 1920,
          fov: 42,
          presetCeu: 'mar'

        parede.raiz.scale.setScalar(0.68);
        palco.cena.add(parede.raiz);

        var menino = M.criarBoneco(THREE, { escala: 0.72 });
        M.capacete(menino, true);
        menino.raiz.position.set(-0.78, 0.35, 0.45);
        palco.cena.add(menino.raiz);

          M.resetPose(menino, t);
          parede.atualizar(t);

          if (t < 6.0) {
            M.humor(menino, 'surpreso');
            M.apontar(menino, [0.32, 1.35, 0.0], 'D');
          } else {
            M.humor(menino, 'assustado');
            M.suar(menino, t, 6.0, DUR);
            M.apontar(menino, [0.45, 1.45, 0.0], 'D');

          M.olharCamera(menino, palco.camera, 0.72);
