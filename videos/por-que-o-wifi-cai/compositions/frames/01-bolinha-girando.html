  <script>
    (function () {
      var DUR = 15.92;
      var tl = gsap.timeline({ paused: true });

      tl.fromTo('#f1-topbar', { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.08);

      tl.fromTo('#f1-telemetry', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.45);
      tl.fromTo('#f1-banner', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: 'back.out(1.6)' }, 5.60);

      if (window.THREE && window.Motor3D) {
        var THREE = window.THREE;
        var M = window.Motor3D;
        var palco = M.criarPalco3D(THREE, {
          container: '#f1-stage-3d',
          largura: 1080,
          altura: 1920,
          fov: 42,
          presetCeu: 'noite'
        });

        var wifi = M.criarRoteadorSinalFraco(THREE);
        wifi.raiz.position.set(0.24, 0.35, -0.1);
        wifi.raiz.scale.setScalar(0.68);
        palco.cena.add(wifi.raiz);

        var menino = M.criarBoneco(THREE, { escala: 0.72 });
        menino.raiz.position.set(-0.78, 0.35, 0.45);
        palco.cena.add(menino.raiz);

        M.conectarHyperFrames(palco, tl, function (t) {
          M.resetPose(menino, t);

          var queda = M.suave(M.faixa(t, 0.4, 8.5));
          wifi.atualizar(t, queda);

          if (t < 5.5) {
            M.humor(menino, 'surpreso');
            M.apontar(menino, [0.45, 1.4, 0.0], 'D');
          } else {
            M.humor(menino, 'bravo');
            M.suar(menino, t, 5.5, DUR);
            M.apontar(menino, [0.85, 1.35, 0.1], 'D');
          }
          M.olharCamera(menino, palco.camera, 0.75);

          M.plano(
            palco.camera,
            t,
            0,
            DUR,
            { pos: [-0.15, 1.85, 7.4], alvo: [0.0, 1.38, 0.0] },
            { pos: [0.15, 1.75, 7.0], alvo: [0.05, 1.38, 0.0] }
          );
        }, { duracao: DUR, offsetGlobal: 0.00 });
