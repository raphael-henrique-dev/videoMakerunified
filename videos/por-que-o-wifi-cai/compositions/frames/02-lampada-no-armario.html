  <script>
    (function () {
      var DUR = 16.66;
      var tl = gsap.timeline({ paused: true });

      tl.fromTo('#f2-topbar', { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.08);
      tl.fromTo('#f2-header', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: 'power3.out' }, 0.20);
      tl.fromTo('#f2-c1', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.45);
      tl.fromTo('#f2-c2', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 5.80);

      if (window.THREE && window.Motor3D) {
        var THREE = window.THREE;
        var M = window.Motor3D;
        var palco = M.criarPalco3D(THREE, {
          container: '#f2-stage-3d',
          largura: 1080,
          altura: 1920,
          fov: 42,
          presetCeu: 'noite'
        });

        var armario = M.criarRoteadorArmario(THREE);
        armario.raiz.position.set(0.28, 0.35, 0.0);
        armario.raiz.scale.setScalar(0.68);
        palco.cena.add(armario.raiz);

        var menino = M.criarBoneco(THREE, { escala: 0.72 });
        menino.raiz.position.set(-0.76, 0.35, 0.45);
        palco.cena.add(menino.raiz);

        M.conectarHyperFrames(palco, tl, function (t) {
          M.resetPose(menino, t);

          var abafado = 1.0 - M.suave(M.faixa(t, 6.2, 8.8));
          armario.atualizar(t, abafado);

          if (t < 6.2) {
            M.pensar(menino, t, 0.2, 6.2);
          } else {
            M.humor(menino, 'feliz');
            M.apontar(menino, [0.28, 1.35, 0.0], 'D');
          }
          M.olharCamera(menino, palco.camera, 0.7);

          M.plano(
            palco.camera,
            t,
            0,
            DUR,
            { pos: [-0.2, 1.85, 7.5], alvo: [0.0, 1.38, 0.0] },
            { pos: [0.15, 1.75, 7.1], alvo: [0.05, 1.38, 0.0] }
          );
        }, { duracao: DUR, offsetGlobal: 15.92 });
      }

      window.__timelines['frame-02-lampada-no-armario'] = tl;
