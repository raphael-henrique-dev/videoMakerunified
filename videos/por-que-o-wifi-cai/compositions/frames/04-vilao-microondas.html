  <script>
    (function () {
      var DUR = 15.35;
      var tl = gsap.timeline({ paused: true });

      tl.fromTo('#f4-topbar', { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.08);
      tl.fromTo('#f4-header', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: 'power3.out' }, 0.20);
      tl.fromTo('#f4-telemetry', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.45);
      tl.fromTo('#f4-banner', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: 'back.out(1.6)' }, 5.50);

      if (window.THREE && window.Motor3D) {
        var THREE = window.THREE;
        var M = window.Motor3D;
        var palco = M.criarPalco3D(THREE, {
          container: '#f4-stage-3d',
          largura: 1080,
          altura: 1920,
          fov: 42,
          presetCeu: 'calor'
        });

        var micro = M.criarMicroondasInterferencia(THREE);
        micro.raiz.position.set(0.28, 0.35, -0.05);
        micro.raiz.scale.setScalar(0.68);
        palco.cena.add(micro.raiz);

        var menino = M.criarBoneco(THREE, { escala: 0.72 });
        menino.raiz.position.set(-0.78, 0.35, 0.45);
        palco.cena.add(menino.raiz);

        M.conectarHyperFrames(palco, tl, function (t) {
          M.resetPose(menino, t);

          var ligado = M.suave(M.faixa(t, 0.3, 4.5));
          micro.atualizar(t, ligado);

          if (t < 5.5) {
            M.humor(menino, 'surpreso');
            M.apontar(menino, [0.28, 1.25, 0.0], 'D');
          } else {
            M.humor(menino, 'assustado');
            M.suar(menino, t, 5.5, DUR);
            M.tremer(palco.camera, t, 5.8, 0.35, 0.05);
          }
          M.olharCamera(menino, palco.camera, 0.72);

          M.plano(
            palco.camera,
            t,
            0,
            DUR,
            { pos: [-0.2, 1.85, 7.5], alvo: [0.0, 1.38, 0.0] },
            { pos: [0.15, 1.78, 7.1], alvo: [0.05, 1.38, 0.0] }
          );
        }, { duracao: DUR, offsetGlobal: 50.35 });

      window.__timelines['frame-04-vilao-microondas'] = tl;
