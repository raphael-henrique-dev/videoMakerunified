          var x0 = 540 + Math.cos(ang) * 202;
          var y0 = 300 + Math.sin(ang) * 202;
          feixesSvg += T('line', { id: 's4-f' + i, x1: f2(x0), y1: f2(y0), x2: 540, y2: 300, stroke: i % 3 === 0 ? '#fbbf24' : '#7dd3fc', 'stroke-width': i % 3 === 0 ? 3 : 2, 'stroke-opacity': 0, 'stroke-dasharray': '230 230' });
        }

        for (var b = 0; b < 16; b++) {
          var ba = (b / 16) * Math.PI * 2;
          parafusos += T('circle', { cx: f2(540 + Math.cos(ba) * 240), cy: f2(300 + Math.sin(ba) * 240), r: 5, fill: '#475569', stroke: '#94a3b8', 'stroke-width': 1.5 });

        var svg = M.svgBase(1080, 630,

          '<radialGradient id="s4-flashGrad" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="0.5" stop-color="#bae6fd" stop-opacity="0.35"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>' +
          '</defs>' +
          T('rect', { x: 0, y: 0, width: 1080, height: 630, fill: 'url(#s4-bgGrad)' }) +
          // câmara
          G({ id: 's4-camara' },
            T('circle', { cx: 540, cy: 300, r: 258, fill: '#0a1424', stroke: '#1e3a5f', 'stroke-width': 8 }) +
            T('circle', { cx: 540, cy: 300, r: 238, fill: 'url(#s4-chamberGrad)', stroke: '#334155', 'stroke-width': 4 }) +
            T('circle', { cx: 540, cy: 300, r: 210, fill: 'none', stroke: '#1e40af', 'stroke-width': 2, 'stroke-opacity': 0.65, 'stroke-dasharray': '14 10' }) +
            parafusos +
            T('path', { d: 'M540 42 L540 78', stroke: '#475569', 'stroke-width': 8 }) +
            T('path', { d: 'M540 522 L540 558', stroke: '#475569', 'stroke-width': 8 }) +
            T('path', { d: 'M282 300 L246 300', stroke: '#475569', 'stroke-width': 8 }) +
            T('path', { d: 'M798 300 L834 300', stroke: '#475569', 'stroke-width': 8 })) +

          // alvo
          G({ id: 's4-alvo' },

            T('text', { x: 700, y: 590, fill: '#f8fafc', 'font-family': 'Inter, sans-serif', 'font-size': 22, 'font-weight': 700 }, '1 ns') +
            T('circle', { id: 's4-led0', cx: 470, cy: 577, r: 5, fill: '#22c55e' }) +
            T('circle', { id: 's4-led1', cx: 486, cy: 577, r: 5, fill: '#22c55e' }) +
            T('circle', { id: 's4-led2', cx: 502, cy: 577, r: 5, fill: '#22c55e' })) +

          G({ id: 's4-lblAlvo' },

        for (var fi = 0; fi < N; fi++) feixes.push(M.pegar(cena, '#s4-f' + fi));
        var alvoAnel = M.pegar(cena, '#s4-alvoAnel');

        var core = M.pegar(cena, '#s4-core');

            feixes[i].setAttribute('stroke-dashoffset', f2(offset));
            feixes[i].setAttribute('stroke-opacity', f2(liga * (0.45 + 0.4 * Math.sin(t * 5 + i))));
          }

          var ignicao = suave(faixa(t, 17.6, 18.4));

          core.setAttribute('r', f2(9 + 22 * ignicao));
          core.setAttribute('fill', ignicao > 0.5 ? '#fffbeb' : '#fef9c3');

          coreHalo.setAttribute('r', f2(52 + 20 * ignicao + Math.sin(t * 8) * 6));
          flash.setAttribute('opacity', f2(Math.max(0, 0.9 - Math.abs(t - 17.6) * 2.2)));
          flash.setAttribute('r', f2(90 + 90 * faixa(t, 17.6, 18.8)));
          alvoAnel.setAttribute('transform', 'rotate(' + f2(t * 26) + ' 540 300)');
          alvoAnel.setAttribute('r', f2(36 + Math.sin(t * 3) * 3));

          var c0 = (t % 1.8) / 1.8;
          onda0.setAttribute('r', f2(24 + c0 * 170));
          onda0.setAttribute('opacity', f2(ignicao * 0.5 * (1 - c0)));
          var c1 = ((t + 0.9) % 1.8) / 1.8;
          onda1.setAttribute('r', f2(24 + c1 * 170));
          onda1.setAttribute('opacity', f2(ignicao * 0.35 * (1 - c1)));

          for (var l = 0; l < leds.length; l++) {
            var pisca = (Math.floor(t * 3 + l) % 3) !== 0;
            leds[l].setAttribute('fill', pisca ? '#22c55e' : '#14532d');
          }

          hud.atualizar(192 * suave(faixa(t, 6.4, 8.0)), ignicao > 0.6 ? 'MINI-ESTRELA ACESA' : 'ALVO: GRÃO DE PIMENTA', ignicao > 0.6 ? '#fbbf24' : '#38bdf8');
          boy.atualizar(t, og, {
            humor: t < 17.6 ? 'surpreso' : 'feliz',
            bracoD: t < 17.6 ? 150 : 128,
            bracoE: t < 17.6 ? 110 : 20,
            olhar: [8, -6],
            inclinar: t > 18 ? -3 : 2,
            pulo: t > 18.2 ? Math.abs(Math.sin(t * 2.8)) * 7 : 0
          });
