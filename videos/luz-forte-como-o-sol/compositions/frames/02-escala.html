<template>
  <style>
    @font-face { font-family:'EB Garamond'; font-style:normal; font-weight:400; font-display:swap; src:url('assets/fonts/EBGaramond-400.woff2') format('woff2'); }
    @font-face { font-family:'EB Garamond'; font-style:normal; font-weight:700; font-display:swap; src:url('assets/fonts/EBGaramond-700.woff2') format('woff2'); }
    @font-face { font-family:'Inter'; font-style:normal; font-weight:400; font-display:swap; src:url('assets/fonts/Inter-400.woff2') format('woff2'); }
    @font-face { font-family:'Inter'; font-style:normal; font-weight:700; font-display:swap; src:url('assets/fonts/Inter-700.woff2') format('woff2'); }
    #f2-root { position:absolute; inset:0; width:1080px; height:1920px; overflow:hidden; background-color:#050a14; font-family:'Inter',sans-serif; color:#f8fafc; }
    .f2-ui-layer { position:absolute; inset:0; z-index:3; pointer-events:none; }
    .f2-topbar { position:absolute; top:76px; left:68px; right:68px; height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 26px; background:rgba(8,14,26,0.88); border:1px solid rgba(56,189,248,0.38); border-radius:14px; }

    .f2-header-card { position:absolute; top:164px; left:68px; right:68px; padding:24px 32px; background:rgba(8,14,26,0.88); border-left:5px solid #38bdf8; border-radius:0 18px 18px 0; box-shadow:0 20px 50px rgba(0,0,0,0.55); }
    .f2-title { font-family:'EB Garamond',serif; font-size:60px; font-weight:700; line-height:1.05; color:#f8fafc; margin-bottom:8px; }
    .f2-title-accent { color:#38bdf8; }
    .f2-subtitle { font-size:22px; line-height:1.36; color:#cbd5e1; }
    .f2-banner { position:absolute; top:1240px; left:68px; right:140px; padding:16px 26px; background:rgba(8,14,26,0.92); border:1.5px solid rgba(250,204,21,0.55); border-radius:14px; display:flex; align-items:center; justify-content:space-between; }
    .f2-banner-text { font-size:20px; font-weight:700; color:#fef9c3; letter-spacing:.04em; }
    .f2-banner-pill { padding:6px 16px; background:#facc15; color:#050a14; font-size:16px; font-weight:700; border-radius:8px; letter-spacing:.06em; }
    #f2-root .m2-fundo { position:absolute; inset:0; z-index:0; background:radial-gradient(circle at 22% 24%, #2a1c08 0%, #0d1526 54%, #050a14 100%); }
    #f2-root .m2-piso { position:absolute; left:0; top:1520px; width:1080px; height:400px; z-index:0; background:linear-gradient(180deg,#0f1d3a 0%,#08111f 100%); border-top:2px solid rgba(56,189,248,0.22); }
    #f2-root .m2-cena { position:absolute; left:0; top:350px; width:1080px; height:630px; z-index:1; }
    #f2-root .m2-mascote { position:absolute; left:26px; top:630px; width:250px; height:350px; z-index:2; }
    #f2-root .m2-hud { position:absolute; left:400px; top:985px; width:540px; height:240px; z-index:2; background:rgba(8,14,26,0.9); border:1px solid rgba(56,189,248,0.32); border-radius:22px; }
  </style>

  <div id="f2-root" data-composition-id="frame-02-escala" data-width="1080" data-height="1920" data-start="0" data-duration="22.37">
    <div class="m2-fundo"></div>
    <div class="m2-piso"></div>
    <div id="f2-cena" class="m2-cena"></div>
    <div id="f2-mascote" class="m2-mascote"></div>
    <div id="f2-hud" class="m2-hud"></div>

    <div class="f2-ui-layer">
      <div id="f2-topbar" class="f2-topbar">
        <span class="f2-kicker">ESCALA // POTÊNCIA DO SOL</span>
        <span class="f2-badge">1.000 W/m²</span>
      </div>
      <div id="f2-header" class="f2-header-card">
        <h1 class="f2-title">Cada Metro Quadrado é um <span class="f2-title-accent">Aquecedor Ligado</span></h1>
        <p class="f2-subtitle">Mais de mil watts por metro quadrado, o dia inteiro. Para imitar isso, é preciso somar centenas de sóis.</p>
      </div>
      <div id="f2-banner" class="f2-banner" style="opacity: 0;">
        <span class="f2-banner-text">CENTENAS DE ESPELHOS SOMAM A LUZ NUM PONTO SÓ</span>
        <span class="f2-banner-pill">CONCENTRAÇÃO</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var DUR = 22.37;
      var tl = gsap.timeline({ paused: true });

      tl.fromTo('#f2-topbar', { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.08);
      tl.fromTo('#f2-header', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: 'power3.out' }, 0.20);
      tl.fromTo('#f2-banner', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: 'back.out(1.6)' }, 18.8);

      var M = window.Motor2D;
      if (M) {
        var T = M.T, G = M.G, suave = M.suave, faixa = M.faixa, f2 = M.f2;

        // campo de heliostatos: 3 fileiras x 5 espelhos
        var espelhos = [];
        var espSvg = '';
        var rows = [[424, 0.9], [478, 1.0], [536, 1.12]];
        for (var ry = 0; ry < rows.length; ry++) {
          for (var cx = 0; cx < 5; cx++) {
            var mx = 128 + cx * 132 + (ry % 2) * 24;
            var my = rows[ry][0];
            var w = 74 * rows[ry][1];
            var h = 30 * rows[ry][1];
            var id = 's2-esp' + ry + '-' + cx;
            espelhos.push({ id: id, x: mx + w / 2, y: my + h / 2, w: w, h: h });
            espSvg += G({ id: id },
              T('path', { d: 'M' + f2(mx) + ' ' + f2(my) + ' L' + f2(mx + w) + ' ' + f2(my - 8) + ' L' + f2(mx + w) + ' ' + f2(my + h - 8) + ' L' + f2(mx) + ' ' + f2(my + h) + ' Z', fill: 'url(#s2-mirrorGrad)', stroke: '#93c5fd', 'stroke-width': 2 }) +
              T('rect', { x: f2(mx + w / 2 - 3), y: f2(my + h), width: 6, height: 20, fill: '#475569' }));
          }
        }

        // feixes dos espelhos para o receptor
        var feixes = '';
        for (var k = 0; k < espelhos.length; k++) {
          var ex = espelhos[k].x, ey = espelhos[k].y - 4;
          feixes += T('line', { id: 's2-feixe' + k, x1: f2(ex), y1: f2(ey), x2: 716, y2: 176, stroke: '#fbbf24', 'stroke-width': 2.2, 'stroke-opacity': 0.18, 'stroke-dasharray': '9 10' });
        }

        var svg = M.svgBase(1080, 630,
          '<defs>' +
          '<linearGradient id="s2-skyGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1730"/><stop offset="0.68" stop-color="#1c1a1f"/><stop offset="1" stop-color="#0b1220"/></linearGradient>' +
          '<linearGradient id="s2-mirrorGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0f2fe"/><stop offset="0.5" stop-color="#7dd3fc"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>' +
          '<linearGradient id="s2-towerGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#334155"/><stop offset="0.5" stop-color="#64748b"/><stop offset="1" stop-color="#334155"/></linearGradient>' +
          '<radialGradient id="s2-receiverGrad" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fffbeb"/><stop offset="0.45" stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>' +
          '</defs>' +
          T('rect', { x: 0, y: 0, width: 1080, height: 630, fill: 'url(#s2-skyGrad)' }) +
          // sol baixo à esquerda
          G({ id: 's2-sol' },
            T('circle', { id: 's2-solHalo', cx: 130, cy: 96, r: 78, fill: '#f59e0b', 'fill-opacity': 0.16 }) +
            T('circle', { cx: 130, cy: 96, r: 46, fill: '#fbbf24' }) +
            T('circle', { cx: 130, cy: 96, r: 34, fill: '#fef3c7' })) +
          // horizonte e piso
          T('rect', { x: 0, y: 470, width: 1080, height: 160, fill: '#0b1220' }) +
          T('rect', { x: 0, y: 470, width: 1080, height: 5, fill: '#1e3a5f' }) +
          T('line', { x1: 0, y1: 552, x2: 1080, y2: 552, stroke: '#16233a', 'stroke-width': 2 }) +
          T('line', { x1: 0, y1: 606, x2: 1080, y2: 606, stroke: '#16233a', 'stroke-width': 2 }) +
          // torre receptora
          G({ id: 's2-torre' },
            T('path', { d: 'M700 500 L726 168 L736 168 L736 500 Z', fill: 'url(#s2-towerGrad)' }) +
            T('path', { d: 'M780 500 L752 168 L742 168 L742 500 Z', fill: 'url(#s2-towerGrad)' }) +
            T('line', { x1: 706, y1: 450, x2: 776, y2: 410, stroke: '#64748b', 'stroke-width': 4 }) +
            T('line', { x1: 712, y1: 370, x2: 770, y2: 330, stroke: '#64748b', 'stroke-width': 4 }) +
            T('line', { x1: 718, y1: 292, x2: 764, y2: 252, stroke: '#64748b', 'stroke-width': 4 }) +
            T('rect', { x: 690, y: 500, width: 104, height: 12, rx: 4, fill: '#1e293b' })) +
          // receptor brilhante
          G({ id: 's2-receptor' },
            T('circle', { id: 's2-recvHalo', cx: 741, cy: 166, r: 66, fill: 'url(#s2-receiverGrad)', opacity: 0.85 }) +
            T('rect', { x: 712, y: 128, width: 58, height: 76, rx: 12, fill: '#0b1220', stroke: '#fbbf24', 'stroke-width': 3 }) +
            T('rect', { id: 's2-recvCore', x: 724, y: 140, width: 34, height: 52, rx: 8, fill: '#fbbf24' }) +
            T('circle', { id: 's2-onda0', cx: 741, cy: 166, r: 46, fill: 'none', stroke: '#fbbf24', 'stroke-width': 3, opacity: 0 }) +
            T('circle', { id: 's2-onda1', cx: 741, cy: 166, r: 46, fill: 'none', stroke: '#fde68a', 'stroke-width': 2, opacity: 0 })) +
          // espelhos e feixes
          espSvg +
          feixes +
          // rótulos editoriais
          G({ id: 's2-lblEsp' },
            T('line', { x1: 210, y1: 594, x2: 300, y2: 524, stroke: '#38bdf8', 'stroke-width': 2.5, 'stroke-dasharray': '6 6' }) +
            T('circle', { cx: 300, cy: 524, r: 5, fill: '#38bdf8' }) +
            T('text', { x: 206, y: 616, fill: '#e2e8f0', 'font-family': 'Inter, sans-serif', 'font-size': 24, 'font-weight': 700, 'letter-spacing': 1 }, 'ESPELHOS')) +
          G({ id: 's2-lblRecv' },
            T('line', { x1: 980, y1: 118, x2: 776, y2: 158, stroke: '#fbbf24', 'stroke-width': 2.5, 'stroke-dasharray': '6 6' }) +
            T('circle', { cx: 776, cy: 158, r: 5, fill: '#fbbf24' }) +
            T('text', { x: 820, y: 106, fill: '#fef9c3', 'font-family': 'Inter, sans-serif', 'font-size': 24, 'font-weight': 700, 'letter-spacing': 1 }, 'RECEPTOR'))
        );
        M.montar('#f2-cena', svg);
        var cena = M.pegar('#f2-cena');
        var solHalo = M.pegar(cena, '#s2-solHalo');
        var recvHalo = M.pegar(cena, '#s2-recvHalo');
        var recvCore = M.pegar(cena, '#s2-recvCore');
        var onda0 = M.pegar(cena, '#s2-onda0');
        var onda1 = M.pegar(cena, '#s2-onda1');
        var feixesEls = [];
        for (var fi = 0; fi < espelhos.length; fi++) feixesEls.push(M.pegar(cena, '#s2-feixe' + fi));
        var espEls = espelhos.map(function (e) { return M.pegar(cena, '#' + e.id); });
        var boy = M.mascote('#f2-mascote');
        var hud = M.medidorBarra('#f2-hud', { rotulo: 'SÓIS CONCENTRADOS', unidade: 'sóis', max: 400, cor: '#f59e0b', decimais: 0 });

        M.conectar(tl, function (t, og) {
          solHalo.setAttribute('r', f2(78 + Math.sin(t * 1.8) * 5));
          var aquecendo = suave(faixa(t, 12.0, 16.8));
          recvCore.setAttribute('fill', aquecendo > 0.9 ? '#fffbeb' : '#fbbf24');
          recvHalo.setAttribute('r', f2(54 + 14 * aquecendo + Math.sin(t * 4) * 4));
          recvHalo.setAttribute('opacity', f2(0.55 + 0.4 * aquecendo));

          for (var i = 0; i < feixesEls.length; i++) {
            var lig = suave(faixa(t, 0.6 + (i % 5) * 0.28, 2.0 + (i % 5) * 0.28));
            feixesEls[i].setAttribute('stroke-opacity', f2(0.08 + 0.42 * lig * (0.7 + 0.3 * Math.sin(t * 3 + i))));
            feixesEls[i].setAttribute('stroke-dashoffset', f2(-t * 34 - i * 6));
          }
          for (var e = 0; e < espEls.length; e++) {
            var tilt = Math.sin(t * 1.2 + e * 0.7) * 1.8;
            espEls[e].setAttribute('transform', 'rotate(' + f2(tilt) + ' ' + f2(espelhos[e].x) + ' ' + f2(espelhos[e].y) + ')');
          }

          var ciclo = (t % 2.4) / 2.4;
          onda0.setAttribute('r', f2(46 + ciclo * 74));
          onda0.setAttribute('opacity', f2(0.55 * (1 - ciclo)));
          var ciclo2 = ((t + 1.2) % 2.4) / 2.4;
          onda1.setAttribute('r', f2(46 + ciclo2 * 74));
          onda1.setAttribute('opacity', f2(0.4 * (1 - ciclo2)));

          hud.atualizar(320 * suave(faixa(t, 12.0, 17.0)), 'CENTENAS DE SÓIS', '#f59e0b');
          boy.atualizar(t, og, {
            humor: t < 12 ? 'surpreso' : 'feliz',
            bracoD: t < 12 ? 120 : 138,
            bracoE: 8,
            olhar: [12, -12],
            inclinar: -3,
            pulo: t > 17.0 ? Math.abs(Math.sin(t * 2.2)) * 5 : 0
          });
        }, { duracao: DUR, offsetGlobal: 15.45 });
      }

      window.__timelines = window.__timelines || {};
      window.__timelines['frame-02-escala'] = tl;
    })();
  </script>
</template>
