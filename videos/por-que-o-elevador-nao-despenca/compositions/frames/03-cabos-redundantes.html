  <div data-hf-id="hf-lt66" id="f3-root" data-composition-id="frame-03-cabos-redundantes" data-width="1080" data-height="1920" data-start="0" data-duration="16.46">

    <div data-hf-id="hf-fx84" class="f3-ui-layer">
      <div data-hf-id="hf-oqh6" id="f3-topbar" class="f3-topbar">
        <span data-hf-id="hf-pz9f" class="f3-kicker">SEGREDO 02 // NUNCA UM CABO SÓ</span>
        <span data-hf-id="hf-lbag" class="f3-badge">4 A 8 POR CABINE</span>
      </div>

      <div data-hf-id="hf-bz3j" id="f3-header" class="f3-header-card">
        <h1 data-hf-id="hf-okmn" class="f3-title">Nunca Um <span data-hf-id="hf-83fr" class="f3-title-accent">Cabo Só</span></h1>
        <p data-hf-id="hf-hpzk" class="f3-subtitle">Cada cabo aguenta a cabine inteira sozinho — e os outros seguram se um falhar</p>
      </div>

      <div data-hf-id="hf-uqlp" id="f3-telemetry" class="f3-telemetry-row">

        <span data-hf-id="hf-pkg8" class="f3-banner-text">SE UM ROMPE, OS OUTROS DIVIDEM O PESO</span>
        <span data-hf-id="hf-jq2w" class="f3-banner-pill">REDUNDÂNCIA</span>
      </div>

  <script>
    (function () {
      var DUR = 16.46;
      var tl = gsap.timeline({ paused: true });

      tl.fromTo('#f3-topbar', { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.08);
      tl.fromTo('#f3-header', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: 'power3.out' }, 0.20);
      tl.fromTo('#f3-telemetry', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out' }, 0.45);
      tl.fromTo('#f3-banner', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: 'back.out(1.6)' }, 9.10);

      var M = window.Motor2D;
      if (M) {
        var T = M.T, G = M.G, lerp = M.lerp, suave = M.suave, faixa = M.faixa, f2 = M.f2;

        var CX = 255, CY = 310;
        var pernas = '', aneis = '';
        for (var i = 0; i < 6; i++) {
          var a = (i * 60 - 90) * Math.PI / 180;
          var px = CX + Math.cos(a) * 78;
          var py = CY + Math.sin(a) * 78;
          pernas += T('circle', { cx: f2(px), cy: f2(py), r: 33, fill: 'url(#s3-fios)', stroke: '#0b1728', 'stroke-width': 5 });
          aneis += T('circle', { cx: f2(px), cy: f2(py), r: 30.5, fill: 'none', stroke: 'rgba(226,232,240,0.42)', 'stroke-width': 2 });
        }

        var svg = M.svgBase(1080, 680,
          '<defs>' +
          '<linearGradient id="s3-cabo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2e8f0"/><stop offset="1" stop-color="#94a3b8"/></linearGradient>' +
          '<linearGradient id="s3-gradCab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b304e"/><stop offset="1" stop-color="#102036"/></linearGradient>' +
          '<pattern id="s3-fios" width="14" height="12.12" patternUnits="userSpaceOnUse">' +
          '<circle cx="3.5" cy="3.5" r="3.4" fill="#b9c7d9"/>' +
          '<circle cx="10.5" cy="3.5" r="3.4" fill="#a6b7cb"/>' +
          '<circle cx="0" cy="9.6" r="3.4" fill="#adbfd2"/>' +
          '<circle cx="7" cy="9.6" r="3.4" fill="#b1c1d4"/>' +
          '<circle cx="14" cy="9.6" r="3.4" fill="#9fb1c6"/>' +
          '</pattern>' +
          '</defs>' +
          // painel esquerdo: corte do cabo
          T('rect', { x: 30, y: 20, width: 450, height: 640, rx: 24, fill: 'rgba(8,18,32,0.72)', stroke: 'rgba(56,189,248,0.30)', 'stroke-width': 2 }) +
          T('text', { x: 255, y: 66, 'text-anchor': 'middle', fill: '#38bdf8', 'font-family': 'Inter, sans-serif', 'font-size': 16, 'font-weight': 700, 'letter-spacing': 2.2 }, 'CORTE DO CABO') +
          G({ id: 's3-anel' },
            T('circle', { cx: CX, cy: CY, r: 126, fill: '#0b1728', stroke: '#38bdf8', 'stroke-width': 3, 'stroke-dasharray': '16 11', opacity: 0.75 })) +
          pernas +
          aneis +
          T('circle', { cx: CX, cy: CY, r: 27, fill: '#c3d0e0', stroke: '#e8eef6', 'stroke-width': 4 }) +
          T('circle', { cx: CX, cy: CY, r: 12, fill: '#8b9db4' }) +
          G({ id: 's3-brilho', opacity: 0 },
            T('circle', { cx: CX, cy: CY, r: 126, fill: 'none', stroke: '#22c55e', 'stroke-width': 6 })) +
          T('text', { x: 255, y: 546, 'text-anchor': 'middle', fill: '#e2e8f0', 'font-family': 'Inter, sans-serif', 'font-size': 18, 'font-weight': 700 }, '6 PERNAS + ALMA DE AÇO') +
          G({ id: 's3-selo', opacity: 0 },
            T('rect', { x: 88, y: 574, width: 334, height: 56, rx: 12, fill: 'rgba(8,26,20,0.92)', stroke: 'rgba(34,197,94,0.55)', 'stroke-width': 2 }) +
            T('text', { x: 255, y: 610, 'text-anchor': 'middle', fill: '#86efac', 'font-family': 'Inter, sans-serif', 'font-size': 18, 'font-weight': 700, 'letter-spacing': 1 }, 'CADA CABO AGUENTA A CABINE')) +
          // painel direito: cabine com 4 cabos
          T('rect', { x: 510, y: 20, width: 540, height: 640, rx: 24, fill: 'rgba(8,18,32,0.72)', stroke: 'rgba(56,189,248,0.30)', 'stroke-width': 2 }) +
          G({ id: 's3-tag', opacity: 0 },
            T('rect', { x: 664, y: 38, width: 232, height: 44, rx: 10, fill: 'rgba(56,189,248,0.12)', stroke: 'rgba(56,189,248,0.5)', 'stroke-width': 2 }) +
            T('text', { x: 780, y: 67, 'text-anchor': 'middle', fill: '#7dd3fc', 'font-family': 'Inter, sans-serif', 'font-size': 17, 'font-weight': 700, 'letter-spacing': 1.4 }, '4 CABOS = REDUNDÂNCIA')) +
          (function () {
            var s = '';
            var xs = [670, 720, 770, 820];
            for (var k = 0; k < 4; k++) {
              s += T('line', { id: 's3-cb' + k, x1: xs[k], y1: 100, x2: xs[k], y2: 478, stroke: '#cbd5e1', 'stroke-width': 5, 'stroke-linecap': 'round' });
              s += G({ id: 's3-pill' + k },
                T('rect', { x: xs[k] - 22, y: 104, width: 44, height: 30, rx: 8, fill: 'rgba(8,20,36,0.95)', stroke: 'rgba(148,163,184,0.5)', 'stroke-width': 1.6 }) +
                T('text', { id: 's3-pct' + k, x: xs[k], y: 125, 'text-anchor': 'middle', fill: '#e2e8f0', 'font-family': 'Inter, sans-serif', 'font-size': 15, 'font-weight': 700 }, '25%'));
            }
            return s;
          })() +
          // cabo 3 rompido (faíscas e pontas)
          G({ id: 's3-romp', opacity: 0 },
            T('path', { d: 'M770 100 L762 154 L778 196 L766 246', fill: 'none', stroke: '#f87171', 'stroke-width': 5, 'stroke-linecap': 'round' }) +
            T('path', { d: 'M770 478 L764 420 L776 384 L768 352', fill: 'none', stroke: '#f87171', 'stroke-width': 5, 'stroke-linecap': 'round' }) +
            T('text', { x: 900, y: 310, 'text-anchor': 'middle', fill: '#f87171', 'font-family': 'Inter, sans-serif', 'font-size': 18, 'font-weight': 700 }, 'ROMPEU') +
            T('path', { d: 'M850 286 L878 290', stroke: '#f87171', 'stroke-width': 3, 'stroke-dasharray': '5 6' })) +
          (function () {
            var s = '';
            for (var q = 0; q < 7; q++) s += T('circle', { id: 's3-sp' + q, r: 4, fill: '#fde047', opacity: 0 });
            return s;
          })() +
          // cabine
          G({ id: 's3-cab' },
            T('rect', { x: 640, y: 478, width: 200, height: 150, rx: 8, fill: 'url(#s3-gradCab)', stroke: '#94a3b8', 'stroke-width': 4 }) +
            T('rect', { x: 652, y: 490, width: 176, height: 126, rx: 4, fill: 'none', stroke: '#27406b', 'stroke-width': 2 }) +
            T('rect', { x: 664, y: 500, width: 68, height: 92, rx: 5, fill: '#0e1b2e', stroke: '#38bdf8', 'stroke-width': 2 }) +
            T('rect', { x: 742, y: 500, width: 68, height: 92, rx: 5, fill: '#0e1b2e', stroke: '#38bdf8', 'stroke-width': 2 }) +
            T('circle', { cx: 738, cy: 546, r: 3, fill: '#38bdf8' }) +
            T('text', { x: 740, y: 616, 'text-anchor': 'middle', fill: '#94a3b8', 'font-family': 'Inter, sans-serif', 'font-size': 14, 'font-weight': 700 }, 'CABINE')) +
          G({ id: 's3-ok', opacity: 0 },
            T('circle', { cx: 880, y: 150, r: 36, fill: 'rgba(34,197,94,0.14)', stroke: '#22c55e', 'stroke-width': 3 }) +
            T('path', { d: 'M862 150 L875 163 L900 136', fill: 'none', stroke: '#22c55e', 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }))
        );
        M.montar('#f3-cena', svg);

        var cena = M.pegar('#f3-cena');
        var anel = M.pegar(cena, '#s3-anel');
        var brilho = M.pegar(cena, '#s3-brilho');
        var selo = M.pegar(cena, '#s3-selo');
        var tag = M.pegar(cena, '#s3-tag');
        var cab = M.pegar(cena, '#s3-cab');
        var romp = M.pegar(cena, '#s3-romp');
        var ok = M.pegar(cena, '#s3-ok');
        var cb = [], pill = [], pct = [];
        for (var k = 0; k < 4; k++) {
          cb[k] = M.pegar(cena, '#s3-cb' + k);
          pill[k] = M.pegar(cena, '#s3-pill' + k);
          pct[k] = M.pegar(cena, '#s3-pct' + k);
        }
        var sp = [];
        for (var q = 0; q < 7; q++) sp.push(M.pegar(cena, '#s3-sp' + q));
        var boy = M.mascote('#f3-mascote');
        var hud = M.medidorBarra('#f3-hud', { rotulo: 'CARGA POR CABO', unidade: '%', max: 100, cor: '#38bdf8', decimais: 0 });

        M.conectar(tl, function (t, og) {
          anel.setAttribute('transform', 'rotate(' + f2(t * 9) + ' ' + CX + ' ' + CY + ')');
          anel.setAttribute('opacity', f2(0.5 + 0.3 * suave(faixa(t, 0.4, 1.2))));
          tag.setAttribute('opacity', f2(suave(faixa(t, 0.5, 1.2))));
          selo.setAttribute('opacity', f2(suave(faixa(t, 4.9, 5.8))));
          brilho.setAttribute('opacity', f2(suave(faixa(t, 4.9, 5.8)) * (0.55 + 0.35 * Math.sin(t * 5))));

          var snap = suave(faixa(t, 9.15, 9.45));
          var carga = 25 + 8 * suave(faixa(t, 9.35, 10.9));
          for (var i = 0; i < 4; i++) {
            var rompido = i === 2;
            cb[i].setAttribute('opacity', f2(rompido ? 1 - snap : 1));
            cb[i].setAttribute('stroke', snap > 0.2 ? (rompido ? '#f87171' : '#22c55e') : '#cbd5e1');
            cb[i].setAttribute('stroke-width', f2(snap > 0.2 ? (rompido ? 0 : 5 + 3 * snap) : 5));
            pill[i].setAttribute('opacity', f2(0.35 + 0.65 * suave(faixa(t, 0.7 + i * 0.12, 1.3 + i * 0.12))));
            pct[i].textContent = rompido ? (snap > 0.5 ? '0%' : '25%') : Math.round(carga) + '%';
            pct[i].setAttribute('fill', rompido && snap > 0.5 ? '#f87171' : (rompido ? '#e2e8f0' : (snap > 0.5 ? '#86efac' : '#e2e8f0')));
          }
          romp.setAttribute('opacity', f2(snap));
          if (snap > 0.05) {
            for (var s = 0; s < 7; s++) {
              var vida = 1 - faixa(t, 9.15 + s * 0.04, 9.95 + s * 0.04);
              var ang = (M.ruido(s * 9) - 0.5) * 3.4;
              var dist = 20 + 70 * faixa(t, 9.15 + s * 0.04, 9.95 + s * 0.04);
              sp[s].setAttribute('cx', f2(770 + Math.cos(ang) * dist));
              sp[s].setAttribute('cy', f2(300 + Math.sin(ang) * dist));
              sp[s].setAttribute('opacity', f2(Math.max(0, vida) * (0.6 + 0.4 * M.ruido(s))));
            }
          } else {
            for (var z = 0; z < 7; z++) sp[z].setAttribute('opacity', 0);
          }
          ok.setAttribute('opacity', f2(suave(faixa(t, 13.7, 14.6))));

          var tensao = 1 + Math.sin(t * 3) * 0.004;
          cab.setAttribute('transform', 'translate(740 553) scale(' + f2(tensao) + ') translate(-740 -553)');

          hud.atualizar(carga, snap > 0.6 ? '3 CABOS SEGURANDO' : '4 CABOS ATIVOS', snap > 0.6 ? '#22c55e' : '#38bdf8');

          var alivio = t >= 13.7;
          boy.atualizar(t, og, {
            humor: alivio ? 'feliz' : (snap > 0.4 ? 'surpreso' : 'neutro'),
            bracoD: alivio ? 120 : 20,
            bracoE: alivio ? 92 : 10,
            olhar: [6, -4],
            tremer: snap > 0.2 && !alivio ? 0.7 : 0,
            pulo: alivio ? Math.abs(Math.sin((t - 13.7) * 4)) * 10 : 0
          });
        }, { duracao: DUR, offsetGlobal: 30.43 });
      }

      window.__timelines = window.__timelines || {};
      window.__timelines['frame-03-cabos-redundantes'] = tl;
    })();
  </script>
</template>
