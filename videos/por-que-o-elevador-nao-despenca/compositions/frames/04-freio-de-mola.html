  <script>
    (function () {

      var tl = gsap.timeline({ paused: true });

      var M = window.Motor2D;
      if (M) {
        var T = M.T, G = M.G, lerp = M.lerp, suave = M.suave, faixa = M.faixa, f2 = M.f2;

        var svg = M.svgBase(1080, 680,

          '<linearGradient id="s4-aco" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#94a3b8"/><stop offset="1" stop-color="#475569"/></linearGradient>' +

          '</defs>' +
          // casa de máquinas
          T('rect', { x: 30, y: 20, width: 670, height: 640, rx: 24, fill: 'rgba(8,18,22,0.78)', stroke: 'rgba(34,197,94,0.28)', 'stroke-width': 2 }) +

          // cabo sobre a polia
          T('path', { d: M.arco(365, 330, 140, 180, 360), fill: 'none', stroke: '#cbd5e1', 'stroke-width': 7, 'stroke-linecap': 'round' }) +
          T('line', { x1: 225, y1: 330, x2: 225, y2: 646, stroke: '#cbd5e1', 'stroke-width': 7, 'stroke-linecap': 'round' }) +
          T('line', { x1: 505, y1: 330, x2: 505, y2: 34, stroke: '#cbd5e1', 'stroke-width': 7, 'stroke-linecap': 'round' }) +
          T('text', { x: 150, y: 288, fill: '#94a3b8', 'font-family': 'Inter, sans-serif', 'font-size': 15, 'font-weight': 700 }, 'CABO') +
          // polia de tração
          G({ id: 's4-sheave' },
            T('circle', { cx: 365, cy: 330, r: 140, fill: '#1e293b', stroke: '#94a3b8', 'stroke-width': 6 }) +
            T('circle', { cx: 365, cy: 330, r: 122, fill: 'none', stroke: '#475569', 'stroke-width': 3 }) +
            T('circle', { cx: 365, cy: 330, r: 104, fill: 'none', stroke: '#334155', 'stroke-width': 3 }) +
            T('line', { x1: 225, y1: 330, x2: 505, y2: 330, stroke: '#64748b', 'stroke-width': 5 }) +
            T('line', { x1: 365, y1: 190, x2: 365, y2: 470, stroke: '#64748b', 'stroke-width': 5 })) +
          // tambor de freio (gira com a polia)
          G({ id: 's4-drum' },
            T('circle', { cx: 365, cy: 330, r: 92, fill: '#0f1a2b', stroke: '#94a3b8', 'stroke-width': 5 }) +
            T('circle', { cx: 365, cy: 330, r: 74, fill: 'none', stroke: '#334155', 'stroke-width': 3 }) +
            (function () {
              var s = '';
              for (var k = 0; k < 6; k++) {
                var ka = k * 60 * Math.PI / 180;
                s += T('line', {
                  x1: f2(365 + Math.cos(ka) * 30), y1: f2(330 + Math.sin(ka) * 30),
                  x2: f2(365 + Math.cos(ka) * 72), y2: f2(330 + Math.sin(ka) * 72),
                  stroke: '#475569', 'stroke-width': 4, 'stroke-linecap': 'round'
                });
              }
              return s;
            })()) +
          // sapatas (duas, com folga visível)
          G({ id: 's4-shoeE' },
            T('path', { d: M.arco(365, 330, 104, 118, 242), fill: 'none', stroke: '#f59e0b', 'stroke-width': 17, 'stroke-linecap': 'round' }) +
            T('path', { d: M.arco(365, 330, 96, 124, 236), fill: 'none', stroke: '#92400e', 'stroke-width': 7, 'stroke-linecap': 'round' })) +
          G({ id: 's4-shoeD' },
            T('path', { d: M.arco(365, 330, 104, -62, 62), fill: 'none', stroke: '#f59e0b', 'stroke-width': 17, 'stroke-linecap': 'round' }) +
            T('path', { d: M.arco(365, 330, 96, -56, 56), fill: 'none', stroke: '#92400e', 'stroke-width': 7, 'stroke-linecap': 'round' })) +
          // eixo / cubo
          T('circle', { cx: 365, cy: 330, r: 26, fill: '#0b1220', stroke: '#38bdf8', 'stroke-width': 4 }) +
          T('circle', { cx: 365, cy: 330, r: 7, fill: '#38bdf8' }) +
          // haste da sapata direita até a mola
          T('line', { x1: 466, y1: 330, x2: 522, y2: 330, stroke: '#64748b', 'stroke-width': 7, 'stroke-linecap': 'round' }) +
          // mola (ancorada à direita)
          G({ id: 's4-spring' },
            T('path', { d: 'M520 330 L534 306 L548 354 L562 306 L576 354 L590 306 L604 354 L618 330', fill: 'none', stroke: '#4ade80', 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' })) +
          T('rect', { x: 618, y: 300, width: 14, height: 60, rx: 4, fill: '#475569' }) +
          T('text', { x: 560, y: 396, 'text-anchor': 'middle', fill: '#4ade80', 'font-family': 'Inter, sans-serif', 'font-size': 15, 'font-weight': 700 }, 'MOLA') +
          T('text', { x: 365, y: 486, 'text-anchor': 'middle', fill: '#fbbf24', 'font-family': 'Inter, sans-serif', 'font-size': 15, 'font-weight': 700, 'letter-spacing': 1.6 }, 'SAPATAS') +
          // eletroímã
          G({ id: 's4-coil', opacity: 1 },
            T('rect', { x: 300, y: 136, width: 130, height: 54, rx: 10, fill: 'url(#s4-cobre)', stroke: '#fbbf24', 'stroke-width': 3 }) +
            T('line', { x1: 310, y1: 150, x2: 420, y2: 150, stroke: '#7c2d12', 'stroke-width': 4 }) +
            T('line', { x1: 310, y1: 164, x2: 420, y2: 164, stroke: '#7c2d12', 'stroke-width': 4 }) +
            T('line', { x1: 310, y1: 178, x2: 420, y2: 178, stroke: '#7c2d12', 'stroke-width': 4 }) +
            T('text', { x: 365, y: 124, 'text-anchor': 'middle', fill: '#fbbf24', 'font-family': 'Inter, sans-serif', 'font-size': 15, 'font-weight': 700 }, 'ELETROÍMÃ')) +
          T('line', { x1: 365, y1: 190, x2: 365, y2: 266, stroke: '#fb923c', 'stroke-width': 6, 'stroke-dasharray': '8 6' }) +
          // faíscas do freio
          (function () {
            var s = '';
            for (var q = 0; q < 8; q++) s += T('circle', { id: 's4-sp' + q, r: 4, fill: '#fde047', opacity: 0 });
            return s;
          })() +
          // painel direito: lógica do freio
          T('rect', { x: 724, y: 20, width: 326, height: 640, rx: 24, fill: 'rgba(8,18,22,0.82)', stroke: 'rgba(34,197,94,0.28)', 'stroke-width': 2 }) +
          T('text', { x: 887, y: 66, 'text-anchor': 'middle', fill: '#22c55e', 'font-family': 'Inter, sans-serif', 'font-size': 16, 'font-weight': 700, 'letter-spacing': 2.0 }, 'LÓGICA DO FREIO') +
          G({ id: 's4-cardMola' },
            T('rect', { x: 754, y: 98, width: 266, height: 128, rx: 16, fill: 'rgba(12,28,22,0.94)', stroke: 'rgba(74,222,128,0.45)', 'stroke-width': 2 }) +
            T('text', { x: 776, y: 132, fill: '#86efac', 'font-family': 'Inter, sans-serif', 'font-size': 15, 'font-weight': 700, 'letter-spacing': 1.4 }, 'MOLA APERTA') +
            T('path', { d: 'M790 172 L806 150 L822 194 L838 150 L854 194 L870 150 L886 194 L902 172', fill: 'none', stroke: '#4ade80', 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }) +
            T('text', { x: 776, y: 210, fill: '#cbd5e1', 'font-family': 'Inter, sans-serif', 'font-size': 14, 'font-weight': 400 }, 'Empurra a sapata contra o tambor')) +
          G({ id: 's4-cardIma' },
            T('rect', { x: 754, y: 244, width: 266, height: 120, rx: 16, fill: 'rgba(28,20,10,0.94)', stroke: 'rgba(251,191,36,0.45)', 'stroke-width': 2 }) +
            T('text', { x: 776, y: 278, fill: '#fbbf24', 'font-family': 'Inter, sans-serif', 'font-size': 15, 'font-weight': 700, 'letter-spacing': 1.4 }, 'ELETROÍMÃ SOLTA') +
            T('rect', { x: 790, y: 298, width: 120, height: 30, rx: 8, fill: 'url(#s4-cobre)', stroke: '#fbbf24', 'stroke-width': 2 }) +
            T('text', { x: 776, y: 352, fill: '#cbd5e1', 'font-family': 'Inter, sans-serif', 'font-size': 14, 'font-weight': 400 }, 'Só abre enquanto tem energia')) +
          G({ id: 's4-power' },
            T('rect', { x: 754, y: 390, width: 266, height: 84, rx: 16, fill: 'rgba(10,26,20,0.94)', stroke: 'rgba(34,197,94,0.55)', 'stroke-width': 2 }) +
            T('circle', { id: 's4-led', cx: 786, cy: 432, r: 12, fill: '#22c55e' }) +
            T('text', { id: 's4-powerTxt', x: 812, y: 440, fill: '#86efac', 'font-family': 'Inter, sans-serif', 'font-size': 21, 'font-weight': 700, 'letter-spacing': 1.2 }, 'ENERGIA OK')) +
          G({ id: 's4-failsafe', opacity: 0 },
            T('rect', { x: 754, y: 500, width: 266, height: 116, rx: 16, fill: 'rgba(30,10,10,0.94)', stroke: 'rgba(248,113,113,0.55)', 'stroke-width': 2 }) +
            T('text', { x: 887, y: 540, 'text-anchor': 'middle', fill: '#fca5a5', 'font-family': 'Inter, sans-serif', 'font-size': 15, 'font-weight': 700, 'letter-spacing': 1.4 }, 'SEM ENERGIA') +
            T('text', { x: 887, y: 578, 'text-anchor': 'middle', fill: '#f8fafc', 'font-family': 'Inter, sans-serif', 'font-size': 24, 'font-weight': 700 }, 'MOLA TRAVA TUDO')) +
          T('rect', { x: 30, y: 20, width: 670, height: 640, rx: 24, fill: 'none', stroke: '#3b5b4c', 'stroke-width': 4 })
        );
        M.montar('#f4-cena', svg);

        var cena = M.pegar('#f4-cena');
        var sheave = M.pegar(cena, '#s4-sheave');
        var drum = M.pegar(cena, '#s4-drum');
        var shoeE = M.pegar(cena, '#s4-shoeE'), shoeD = M.pegar(cena, '#s4-shoeD');
        var spring = M.pegar(cena, '#s4-spring');
        var coil = M.pegar(cena, '#s4-coil');
        var speed = 0;
        var sp = [];
        for (var q = 0; q < 8; q++) sp.push(M.pegar(cena, '#s4-sp' + q));
        var power = M.pegar(cena, '#s4-power');
        var led = M.pegar(cena, '#s4-led');
        var powerTxt = M.pegar(cena, '#s4-powerTxt');
        var failsafe = M.pegar(cena, '#s4-failsafe');
        var boy = M.mascote('#f4-mascote');
        var hud = M.medidorBarra('#f4-hud', { rotulo: 'FREIO DE PARADA', unidade: '%', max: 100, cor: '#22c55e', decimais: 0 });

        M.conectar(tl, function (t, og) {
          // gira até o freio morder (≈2,7s) e para de vez no "trava" (≈4,2s)
          var girando = faixa(t, 0, 2.7);
          var freando = faixa(t, 2.7, 4.15);
          var ang = -suave(girando) * 330 - suave(freando) * 120;
          sheave.setAttribute('transform', 'rotate(' + f2(ang) + ' 365 330)');
          drum.setAttribute('transform', 'rotate(' + f2(ang) + ' 365 330)');

          var freio = suave(faixa(t, 2.55, 3.05));
          var gap = lerp(20, 0, freio);
          shoeE.setAttribute('transform', 'translate(' + f2(-gap) + ' 0)');
          shoeD.setAttribute('transform', 'translate(' + f2(gap) + ' 0)');
          spring.setAttribute('transform', 'translate(618 330) scale(' + f2(lerp(0.62, 1, freio)) + ' 1) translate(-618 -330)');

          // falha de energia no segundo bloco (≈10s)
          var semLuz = suave(faixa(t, 9.9, 10.35));
          coil.setAttribute('opacity', f2(1 - 0.85 * semLuz));
          power.setAttribute('stroke', semLuz > 0.5 ? 'rgba(248,113,113,0.65)' : 'rgba(34,197,94,0.55)');
          led.setAttribute('fill', semLuz > 0.5 ? '#ef4444' : '#22c55e');
          powerTxt.textContent = semLuz > 0.5 ? 'SEM ENERGIA' : 'ENERGIA OK';
          powerTxt.setAttribute('fill', semLuz > 0.5 ? '#fca5a5' : '#86efac');
          failsafe.setAttribute('opacity', f2(semLuz));

          if (freio > 0.02 && freio < 1) {
            for (var s = 0; s < 8; s++) {
              var vida = 1 - faixa(t, 2.6 + s * 0.03, 3.3 + s * 0.03);
              var a = (M.ruido(s * 7) - 0.5) * 2.8;
              var d = 20 + 58 * faixa(t, 2.6 + s * 0.03, 3.3 + s * 0.03);
              sp[s].setAttribute('cx', f2(365 + Math.cos(a) * (106 + d)));
              sp[s].setAttribute('cy', f2(330 + Math.sin(a) * (106 + d)));
              sp[s].setAttribute('opacity', f2(Math.max(0, vida) * 0.9));
            }
          } else {
            for (var z = 0; z < 8; z++) sp[z].setAttribute('opacity', 0);
          }

          var valor = 100 * freio;
          hud.atualizar(valor, semLuz > 0.5 ? 'FALHA SEGURA' : (freio > 0.9 ? 'TRAVADO' : 'SOLTO'), semLuz > 0.5 ? '#f87171' : '#22c55e');

          boy.atualizar(t, og, {
            humor: semLuz > 0.5 ? 'feliz' : (freio > 0.5 ? 'surpreso' : 'neutro'),
            bracoD: semLuz > 0.5 ? 108 : (freio > 0.5 ? 40 : 16),
            bracoE: semLuz > 0.5 ? 74 : 8,
            olhar: [4, -2],
            pulo: semLuz > 0.5 ? Math.abs(Math.sin((t - 10.2) * 4.2)) * 8 : 0
          });
        }, { duracao: DUR, offsetGlobal: 46.89 });
      }

      window.__timelines = window.__timelines || {};
      window.__timelines['frame-04-freio-de-mola'] = tl;
    })();
  </script>
