          cab1.setAttribute('opacity', f2(1 - romp));
          frayT.setAttribute('opacity', f2(romp));

          wedgeE.setAttribute('transform', 'translate(0 ' + f2(dy) + ') translate(380 318) scale(' + f2(sx) + ' 1) translate(-380 -318)');
