          '</defs>' +
          T('rect', { x: 0, y: 0, width: 1080, height: 630, fill: 'url(#s5-skyGrad)' }) +
          estrelas +
          T('circle', { cx: 900, cy: 92, r: 46, fill: '#e2e8f0', 'fill-opacity': 0.10 }) +

        var calorEls = [M.pegar(cena, '#s5-calor0'), M.pegar(cena, '#s5-calor1'), M.pegar(cena, '#s5-calor2')];
        var barraElsDom = barraEls.map(function (bid) { return M.pegar(cena, '#' + bid); });
