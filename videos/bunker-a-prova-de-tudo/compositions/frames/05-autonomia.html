  <script>
    (function () {
      var DUR = 18.64;
      var tl = gsap.timeline({ paused: true });

      tl.fromTo('#f5-topbar', { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.08);
      tl.fromTo('#f5-header', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: 'power3.out' }, 0.20);
      tl.fromTo('#f5-banner', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: 'back.out(1.6)' }, 15.6);

      var M = window.Motor2D;
      if (M) {
        var T = M.T, G = M.G, lerp = M.lerp, suave = M.suave, faixa = M.faixa, f2 = M.f2;

        function card(y, titulo, cor) {
          return T('rect', { x: 336, y: y, width: 594, height: 136, rx: 18, fill: 'rgba(20,12,4,0.92)', stroke: cor, 'stroke-width': 1.6 }) +
            T('text', { x: 358, y: y + 26, fill: cor, 'font-family': 'Inter, sans-serif', 'font-size': 14, 'font-weight': 700, 'letter-spacing': 1.6 }, titulo);
        }

        var celulas = '';
        for (var b = 0; b < 4; b++) {
          var cx0 = 358 + b * 54;
          celulas += T('rect', { x: cx0, y: 218, width: 46, height: 100, rx: 6, fill: '#0b1220', stroke: '#64748b', 'stroke-width': 2 });
          celulas += T('rect', { x: cx0 + 3, y: 223, width: 40, height: 90, rx: 4, fill: '#0f172a' });
          celulas += T('rect', { id: 's5-bat' + b, x: cx0 + 4, y: 313, width: 38, height: 0, rx: 4, fill: '#f59e0b' });
        }

        var dias90 = '';
        for (var dd = 0; dd < 90; dd++) {
          dias90 += T('circle', {
            id: 's5-dia' + dd,
            cx: 50 + (dd % 10) * 22,
            cy: 172 + Math.floor(dd / 10) * 11,
            r: 3.5,
            fill: '#334155'
          });
        }

        var svg = M.svgBase(1080, 640,
          '<defs>' +
          '<linearGradient id="s5-metalGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#94a3b8"/><stop offset="1" stop-color="#475569"/></linearGradient>' +
          '<linearGradient id="s5-aguaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0e7490"/></linearGradient>' +
          '<linearGradient id="s5-motorGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b45309"/><stop offset="1" stop-color="#7c2d12"/></linearGradient>' +
          '</defs>' +
          T('rect', { x: 0, y: 0, width: 1080, height: 640, fill: '#0a0703' }) +
          // painel de autonomia (acima do mascote)
          T('rect', { x: 30, y: 20, width: 258, height: 258, rx: 18, fill: 'rgba(26,16,6,0.94)', stroke: 'rgba(245,158,11,0.40)', 'stroke-width': 2 }) +
          T('text', { x: 48, y: 52, fill: '#fbbf24', 'font-family': 'Inter, sans-serif', 'font-size': 14, 'font-weight': 700, 'letter-spacing': 1.4 }, 'AUTONOMIA') +
          T('text', { id: 's5-diasBig', x: 48, y: 122, fill: '#f8fafc', 'font-family': 'Inter, sans-serif', 'font-size': 62, 'font-weight': 700 }, '0') +
          T('text', { x: 150, y: 120, fill: '#fbbf24', 'font-family': 'Inter, sans-serif', 'font-size': 22, 'font-weight': 700, 'letter-spacing': 1.2 }, 'DIAS') +
          T('text', { x: 48, y: 146, fill: '#cbd5e1', 'font-family': 'Inter, sans-serif', 'font-size': 12, 'font-weight': 400 }, 'trancado, sem reabastecer') +
          dias90 +
          // card 1: gerador
          card(26, 'GERADOR A DIESEL', '#fbbf24') +
          T('rect', { x: 358, y: 74, width: 128, height: 50, rx: 8, fill: 'url(#s5-motorGrad)', stroke: '#f59e0b', 'stroke-width': 2.5 }) +
          T('rect', { x: 370, y: 84, width: 62, height: 30, rx: 4, fill: '#1c1004' }) +
          (function () {
            var s = '';
            for (var l = 0; l < 4; l++) s += T('line', { x1: 376, y1: 91 + l * 6, x2: 426, y2: 91 + l * 6, stroke: '#f59e0b', 'stroke-width': 2, opacity: 0.7 });
            return s;
          })() +
          T('rect', { x: 466, y: 68, width: 16, height: 26, fill: '#334155' }) +
          G({ id: 's5-volante' },
            T('circle', { cx: 512, cy: 99, r: 17, fill: 'none', stroke: '#cbd5e1', 'stroke-width': 3.5 }) +
            T('line', { x1: 512, y1: 84, x2: 512, y2: 114, stroke: '#cbd5e1', 'stroke-width': 3 }) +
            T('line', { x1: 497, y1: 99, x2: 527, y2: 99, stroke: '#cbd5e1', 'stroke-width': 3 })) +
          T('text', { x: 552, y: 84, fill: '#cbd5e1', 'font-family': 'Inter, sans-serif', 'font-size': 12, 'font-weight': 700, 'letter-spacing': 1.2 }, 'DIESEL') +
          T('rect', { x: 552, y: 92, width: 356, height: 16, rx: 8, fill: '#1c1917', stroke: '#475569', 'stroke-width': 1.5 }) +
          T('rect', { id: 's5-fuel', x: 554, y: 94, width: 352, height: 12, rx: 6, fill: '#f59e0b' }) +
          T('text', { x: 552, y: 136, fill: '#cbd5e1', 'font-family': 'Inter, sans-serif', 'font-size': 13, 'font-weight': 400 }, 'queima lá fora, longe do ar de dentro') +
          // card 2: baterias
          card(174, 'BATERIAS', '#4ade80') +
          celulas +
          T('text', { x: 594, y: 242, fill: '#cbd5e1', 'font-family': 'Inter, sans-serif', 'font-size': 14, 'font-weight': 400 }, 'seguram a bomba') +
          T('text', { x: 594, y: 264, fill: '#cbd5e1', 'font-family': 'Inter, sans-serif', 'font-size': 14, 'font-weight': 400 }, 'e a luz por 90 dias') +
          T('rect', { x: 594, y: 280, width: 176, height: 26, rx: 13, fill: 'rgba(6,32,20,0.55)', stroke: '#22c55e', 'stroke-width': 1.5 }) +
          T('text', { id: 's5-cargaTxt', x: 682, y: 298, 'text-anchor': 'middle', fill: '#86efac', 'font-family': 'Inter, sans-serif', 'font-size': 11.5, 'font-weight': 700, 'letter-spacing': 1.2 }, 'EM ESPERA') +
          // card 3: água
          card(322, 'ÁGUA FILTRADA', '#22d3ee') +
          T('rect', { x: 358, y: 366, width: 96, height: 100, rx: 10, fill: '#0b1220', stroke: '#22d3ee', 'stroke-width': 2.5 }) +
          T('rect', { id: 's5-tanque', x: 364, y: 448, width: 84, height: 12, rx: 5, fill: 'url(#s5-aguaGrad)' }) +
          T('line', { x1: 358, y1: 410, x2: 454, y2: 410, stroke: '#67e8f9', 'stroke-width': 1.8, 'stroke-dasharray': '6 5' }) +
          T('rect', { x: 366, y: 380, width: 78, height: 20, rx: 5, fill: 'rgba(4,12,16,0.94)' }) +
          T('text', { x: 405, y: 394, 'text-anchor': 'middle', fill: '#cffafe', 'font-family': 'Inter, sans-serif', 'font-size': 11, 'font-weight': 700 }, '2.000 L') +
          T('rect', { x: 470, y: 372, width: 58, height: 88, rx: 8, fill: 'rgba(8,20,24,0.92)', stroke: '#22d3ee', 'stroke-width': 2 }) +
          T('text', { x: 499, y: 390, 'text-anchor': 'middle', fill: '#67e8f9', 'font-family': 'Inter, sans-serif', 'font-size': 10.5, 'font-weight': 700 }, 'FILTRO') +
          T('rect', { x: 480, y: 400, width: 38, height: 12, rx: 4, fill: '#334155' }) +
          T('rect', { x: 480, y: 422, width: 38, height: 12, rx: 4, fill: '#475569' }) +
          T('rect', { x: 480, y: 444, width: 38, height: 12, rx: 4, fill: '#334155' }) +
          T('path', { d: 'M446 416 L470 416', fill: 'none', stroke: '#22d3ee', 'stroke-width': 5, 'stroke-linecap': 'round' }) +
          T('path', { d: 'M528 440 L566 440', fill: 'none', stroke: '#22d3ee', 'stroke-width': 5, 'stroke-linecap': 'round' }) +
          T('circle', { cx: 570, cy: 440, r: 5, fill: '#67e8f9' }) +
          T('text', { x: 594, y: 384, fill: '#67e8f9', 'font-family': 'Inter, sans-serif', 'font-size': 30, 'font-weight': 700 }, '2.000 L') +
          T('text', { x: 594, y: 408, fill: '#cbd5e1', 'font-family': 'Inter, sans-serif', 'font-size': 13.5, 'font-weight': 400 }, 'filtrada e estocada') +
          T('text', { x: 594, y: 430, fill: '#cbd5e1', 'font-family': 'Inter, sans-serif', 'font-size': 13.5, 'font-weight': 400 }, 'passa por carvão antes de beber') +
          // card 4: comida
          T('rect', { x: 336, y: 470, width: 594, height: 136, rx: 18, fill: 'rgba(20,12,4,0.92)', stroke: '#fb923c', 'stroke-width': 1.6 }) +
          T('text', { x: 594, y: 500, fill: '#fb923c', 'font-family': 'Inter, sans-serif', 'font-size': 14, 'font-weight': 700, 'letter-spacing': 1.6 }, 'COMIDA SECA') +
          T('rect', { x: 358, y: 512, width: 202, height: 5, rx: 2.5, fill: '#64748b' }) +
          T('rect', { x: 358, y: 544, width: 202, height: 5, rx: 2.5, fill: '#64748b' }) +
          T('rect', { x: 358, y: 576, width: 202, height: 5, rx: 2.5, fill: '#64748b' }) +
          (function () {
            var s = '';
            for (var i = 0; i < 8; i++) {
              var lx = 366 + (i % 4) * 48;
              var ly = i < 4 ? 482 : 514;
              s += T('rect', { id: 's5-lata' + i, x: lx, y: ly, width: 38, height: 28, rx: 4, fill: i % 3 === 0 ? '#b45309' : (i % 3 === 1 ? '#166534' : '#7c2d12'), stroke: '#fbbf24', 'stroke-width': 1.5 });
              s += T('rect', { x: lx + 7, y: ly + 8, width: 24, height: 5, rx: 2.5, fill: '#f8fafc', opacity: 0.7 });
            }
            return s;
          })() +
          T('rect', { x: 366, y: 548, width: 60, height: 26, rx: 4, fill: '#334155', stroke: '#94a3b8', 'stroke-width': 1.5 }) +
          T('path', { d: 'M396 570 L396 558 M396 562 Q388 560 386 552 M396 564 Q404 562 406 554', fill: 'none', stroke: '#4ade80', 'stroke-width': 2.4, 'stroke-linecap': 'round' }) +
          T('text', { x: 434, y: 566, fill: '#cbd5e1', 'font-family': 'Inter, sans-serif', 'font-size': 11.5, 'font-weight': 400 }, 'sementes pra replantar') +
          T('text', { x: 594, y: 528, fill: '#cbd5e1', 'font-family': 'Inter, sans-serif', 'font-size': 13.5, 'font-weight': 400 }, 'enlatada e seca:') +
          T('text', { x: 594, y: 550, fill: '#cbd5e1', 'font-family': 'Inter, sans-serif', 'font-size': 13.5, 'font-weight': 400 }, 'não estraga por anos') +
          T('text', { x: 594, y: 572, fill: '#fdba74', 'font-family': 'Inter, sans-serif', 'font-size': 13.5, 'font-weight': 700 }, 'e dá pra replantar')
        );
        M.montar('#f5-cena', svg);
        var cena = M.pegar('#f5-cena');
        var volante = M.pegar(cena, '#s5-volante');
        var fuel = M.pegar(cena, '#s5-fuel');
        var tanque = M.pegar(cena, '#s5-tanque');
        var diasBig = M.pegar(cena, '#s5-diasBig');
        var cargaTxt = M.pegar(cena, '#s5-cargaTxt');
        var bats = [];
        for (var b2 = 0; b2 < 4; b2++) bats.push(M.pegar(cena, '#s5-bat' + b2));
        var latas = [];
        for (var l2 = 0; l2 < 8; l2++) latas.push(M.pegar(cena, '#s5-lata' + l2));
        var pontos = [];
        for (var p2 = 0; p2 < 90; p2++) pontos.push(M.pegar(cena, '#s5-dia' + p2));
        var boy = M.mascote('#f5-mascote');
        var hud = M.medidorBarra('#f5-hud', { rotulo: 'AUTONOMIA TOTAL', unidade: 'DIAS', max: 90, cor: '#f59e0b', decimais: 0 });

        M.conectar(tl, function (t, og) {
          var gerando = suave(faixa(t, 5.2, 6.4));
          var carga = suave(faixa(t, 7.2, 9.2));
          var aguando = suave(faixa(t, 11.8, 13.4));
          var estocando = suave(faixa(t, 13.2, 15.0));
          var dias = Math.round(90 * suave(faixa(t, 4.6, 11.4)));

          volante.setAttribute('transform', 'rotate(' + f2(t * 420 * Math.max(0.1, gerando)) + ' 512 99)');
          fuel.setAttribute('width', f2(352 - 130 * faixa(t, 5.4, 17.0)));
          fuel.setAttribute('fill', faixa(t, 5.4, 17.0) > 0.72 ? '#f87171' : '#f59e0b');

          for (var i = 0; i < 4; i++) {
            var h = 88 * suave(faixa(t, 7.2 + i * 0.3, 8.1 + i * 0.3));
            bats[i].setAttribute('y', f2(313 - h));
            bats[i].setAttribute('height', f2(h));
            bats[i].setAttribute('fill', carga > 0.9 ? '#22c55e' : '#f59e0b');
          }

          var alturaAgua = lerp(12, 88, aguando);
          tanque.setAttribute('y', f2(460 - alturaAgua));
          tanque.setAttribute('height', f2(alturaAgua));

          for (var j = 0; j < 8; j++) {
            var aparece = suave(faixa(t, 13.2 + j * 0.15, 13.7 + j * 0.15));
            var baseY = j < 4 ? 482 : 514;
            latas[j].setAttribute('transform', 'translate(0 ' + f2((1 - aparece) * 24) + ')');
            latas[j].setAttribute('opacity', f2(aparece));
            latas[j].setAttribute('y', baseY);
          }

          diasBig.textContent = String(dias);
          for (var z = 0; z < 90; z++) {
            pontos[z].setAttribute('fill', z < dias ? (dias >= 89 ? '#22c55e' : '#fbbf24') : '#334155');
          }
          cargaTxt.textContent = dias >= 88 ? 'RESERVA CHEIA' : (carga > 0.5 ? 'CARREGANDO' : 'EM ESPERA');
          cargaTxt.setAttribute('fill', dias >= 88 ? '#86efac' : (carga > 0.5 ? '#fbbf24' : '#94a3b8'));

          hud.atualizar(dias, dias >= 88 ? 'TUDO ESTOCADO' : 'PREPARANDO SISTEMAS', dias >= 88 ? '#22c55e' : '#f59e0b');

          boy.atualizar(t, og, {
            humor: dias >= 88 && t < 16.0 ? 'feliz' : (t >= 16.0 ? 'triste' : (t > 5.0 ? 'surpreso' : 'neutro')),
            capacete: true,
            bracoD: dias >= 88 && t < 16.0 ? 118 : 46,
            bracoE: dias >= 88 && t < 16.0 ? 70 : 10,
            olhar: [8, -2],
            pulo: dias >= 88 && t < 16.0 ? Math.abs(Math.sin((t - 14.5) * 3.2)) * 5 : 0
          });
        }, { duracao: DUR, offsetGlobal: 66.24 });
      }

      window.__timelines = window.__timelines || {};
      window.__timelines['frame-05-autonomia'] = tl;
    })();
  </script>
</template>
