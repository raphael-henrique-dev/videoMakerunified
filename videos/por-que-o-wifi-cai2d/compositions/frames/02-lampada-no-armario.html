        var svg = M.svgBase(1080, 680,
          '<defs>' +
          '<linearGradient id="s2-tv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e7490"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>' +

          '<clipPath id="s2-clip-dir"><rect x="560" y="30" width="490" height="600" rx="26"/></clipPath>' +

          // painel esquerdo: escondido

            T('rect', { x: 105, y: 80, width: 340, height: 200, rx: 14, fill: '#0b1220', stroke: '#64748b', 'stroke-width': 6 }) +

            T('path', { d: 'M117 268 L190 190 L240 240 L300 170 L433 268 Z', fill: '#0b1220', 'fill-opacity': 0.4 }) +
            T('rect', { x: 245, y: 280, width: 60, height: 20, fill: '#475569' }) +
            T('rect', { x: 205, y: 298, width: 140, height: 10, rx: 5, fill: '#64748b' }) +
            T('rect', { x: 80, y: 312, width: 390, height: 280, rx: 14, fill: '#78350f', stroke: '#451a03', 'stroke-width': 4 }) +
            T('rect', { x: 100, y: 330, width: 350, height: 240, rx: 8, fill: '#1c1917' }) +
            T('ellipse', { cx: 275, cy: 490, rx: 150, ry: 100, fill: 'url(#s2-halo2)' }) +
            M.roteadorSVG(275, 560, 0.85, 's2-re') +
            G({ 'clip-path': 'url(#s2-clip-arm)' }, M.criarOndas('s2-oe', 4, true)) +
            T('rect', { x: 80, y: 312, width: 195, height: 280, rx: 14, fill: '#92400e', 'fill-opacity': 0.82, stroke: '#451a03', 'stroke-width': 4 }) +

            T('circle', { cx: 252, cy: 452, r: 7, fill: '#fbbf24' }) + T('circle', { cx: 298, cy: 452, r: 7, fill: '#fbbf24' }) +
            T('path', { d: 'M110 350 L240 350 M110 372 L240 372 M310 350 L440 350 M310 372 L440 372', stroke: '#b45309', 'stroke-width': 3 }) +
            bulb(470, 66, false, 's2-bulbE')
          ) +
          // painel direito: livre e no alto
          G({ id: 's2-dir' },

              T('circle', { id: 's2-haloc', cx: 830, cy: 215, r: 200, fill: 'url(#s2-halo)' }) +

            T('rect', { x: 700, y: 272, width: 260, height: 14, rx: 5, fill: '#a16207' }) +

            M.roteadorSVG(830, 272, 1.05, 's2-rd') +
            // aparelhos que "acendem": notebook, celular, TV pequena

            G({ id: 's2-dev1', transform: 'translate(800 440)' }, T('rect', { x: 0, y: 0, width: 66, height: 120, rx: 14, fill: '#0b1220', stroke: '#94a3b8', 'stroke-width': 4 }) + T('rect', { x: 7, y: 12, width: 52, height: 90, rx: 8, fill: '#a78bfa' }) + T('circle', { cx: 33, cy: -18, r: 11, fill: '#22c55e' })) +
            G({ id: 's2-dev2', transform: 'translate(910 470)' }, T('rect', { x: 0, y: 0, width: 110, height: 70, rx: 8, fill: '#0b1220', stroke: '#94a3b8', 'stroke-width': 4 }) + T('rect', { x: 8, y: 8, width: 94, height: 54, rx: 4, fill: '#fb923c' }) + T('rect', { x: 40, y: 72, width: 30, height: 10, fill: '#94a3b8' }) + T('circle', { cx: 55, cy: -18, r: 11, fill: '#22c55e' })) +

        M.conectar(tl, function (t, og) {
          var virada = suave(faixa(t, 7.5, 8.4));
          esq.setAttribute('opacity', f2(lerp(1, 0.4, virada)));
          dir.setAttribute('opacity', f2(lerp(0.32, 1, virada)));
          // ondas presas no armário (amarelo fraco)
          M.animarOndas(oe, 275, 490, t, { periodo: 2.6, r0: 20, rMax: 200, circulo: true, largura: 5, cor: '#fbbf24', opac: function (r, ph) { return 0.5 * (1 - ph); } });
          M.piscarLeds(cena, 's2-re', t, '#fbbf24');
          // ondas soltas (casa iluminada)
          M.animarOndas(od, 830, 215, t, {
            periodo: 3.0, r0: 30, rMax: 330, circulo: true, largura: 6,
            cor: function (r) { return mix('#fde047', '#38bdf8', (r - 30) / 300); },
            opac: function (r, ph) { return 0.9 * (1 - ph) * virada; }
          });
          M.piscarLeds(cena, 's2-rd', t, '#22c55e');
          halo.setAttribute('r', f2(170 + 60 * Math.sin(t * 2.2) * virada));
          halo.setAttribute('opacity', f2(0.15 + 0.85 * virada));
          // aparelhos acendem em sequência
          for (var i = 0; i < 3; i++) {
            var d = M.pegar(cena, '#s2-dev' + i);
            d.setAttribute('opacity', f2(0.25 + 0.75 * suave(faixa(t, 8.6 + i * 0.5, 9.2 + i * 0.5))));
          }
          var pop = suave(faixa(t, 7.6, 8.1));
          bE.setAttribute('opacity', f2(pop)); bD.setAttribute('opacity', f2(pop));
          // "tranca a luz dentro da gaveta" → lâmpada esquerda balança
          var bal = t > 10.9 && t < 12.8 ? Math.sin((t - 10.9) * 14) * 6 : 0;
          bE.setAttribute('transform', 'translate(470 66) rotate(' + f2(bal) + ')');
          var nivel = t < 7.6 ? 1.1 + 0.15 * Math.sin(t * 3) : lerp(1.1, 3.9, suave(faixa(t, 7.8, 10.2)));
          hud.atualizar(nivel, 'SINAL NA CASA TODA');
          var feliz = t >= 7.6;
          boy.atualizar(t, og, {
            humor: feliz ? 'feliz' : 'triste',
            bracoD: feliz ? 80 + 80 * suave(faixa(t, 9.5, 10.3)) : 70, bracoE: feliz ? 20 : 10,
            pulo: feliz ? Math.abs(Math.sin(Math.max(0, t - 9.5) * 4)) * 6 * suave(faixa(t, 9.5, 10)) : 0,
            olhar: [3, -3]
          });
        }, { duracao: DUR, offsetGlobal: 15.92 });

      }
