        var rosto = M.pegar(cena, '#s4-rosto'), spinW = M.pegar(cena, '#s4-spinw'), spin = M.pegar(cena, '#s4-spin');
        var boom = M.pegar(cena, '#s4-boom'), truck = M.pegar(cena, '#s4-truckg'), truckInner = M.pegar(cena, '#s4-truck'), buzina = M.pegar(cena, '#s4-buzina');
        var gl = []; for (var gi = 0; gi < 6; gi++) gl.push(M.pegar(cena, '#s4-gl' + gi));
        var boy = M.mascote('#f4-mascote');

        M.conectar(tl, function (t, og) {
          var on = suave(faixa(t, 1.1, 1.6));       // micro-ondas liga em "liga o micro-ondas"
          var tx = Math.sin(t * 72) * 2.4 * on, ty = Math.cos(t * 83) * 1.6 * on;

          brilho.setAttribute('opacity', f2(on * (0.55 + 0.25 * Math.sin(t * 9))));
          var seg = Math.max(0, 59 - Math.floor(Math.max(0, t - 1.4)));
          timer.textContent = '0:' + (seg < 10 ? '0' : '') + seg;
          for (var i = 0; i < 3; i++) {
            var a = t * 3.2 + i * 2.094;
            orb[i].setAttribute('cx', f2(205 + 66 * Math.cos(a))); orb[i].setAttribute('cy', f2(438 + 9 * Math.sin(a)));
            orb[i].setAttribute('opacity', f2(on));

          // anéis vermelhos do micro-ondas
          M.animarOndas(verm, 250, 400, t, {

            opac: function (r, ph) { return 0.9 * Math.pow(1 - ph, 0.7) * on; }

          // Wi-Fi azul do roteador

          // colisão

          // chamada trava (glitch)
          var q = Math.floor(t * 14);
          for (var g = 0; g < 6; g++) {
            var vis = M.ruido(q * 7 + g * 3) > 0.45 ? 1 : 0;
            gl[g].setAttribute('opacity', f2(vis * 0.75 * on));
            gl[g].setAttribute('transform', 'translate(' + f2((M.ruido(q + g) - 0.5) * 34 * on) + ' 0)');
          }
          rosto.setAttribute('transform', 'translate(' + f2((M.ruido(q * 3) - 0.5) * 12 * on) + ' ' + f2((M.ruido(q * 5) - 0.5) * 6 * on) + ')');
          var trava = suave(faixa(t, 3.7, 4.2));
          spinW.setAttribute('opacity', f2(trava));
          spin.setAttribute('transform', 'rotate(' + f2(t * 430) + ' 90 125)');
          // caminhão buzinando (segunda frase)
          var ent = suave(faixa(t, 6.1, 7.4));
          truck.setAttribute('opacity', f2(ent > 0.01 ? 1 : 0));
          truck.setAttribute('transform', 'translate(' + f2(lerp(1260, 700, ent)) + ' 604) scale(0.95)');

          var nivel = 3.8 - 2.6 * suave(faixa(t, 1.6, 2.7)) - 0.4 * suave(faixa(t, 3.7, 4.4));

            bracoD: fase2 ? 168 : 70, bracoE: fase2 ? 168 : 12,
            inclinar: fase2 ? -5 : 0, tremer: fase2 ? 0.9 : 0, olhar: [4, -3]

        }, { duracao: DUR, offsetGlobal: 50.35 });

      }
